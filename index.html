<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundry Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cobalt:#1E2D6B;
    --cobalt-deep:#131D4A;
    --on-cobalt:#E9EDFB;
    --on-cobalt-soft:#AEB8DE;
    --stock:#F4F6FB;
    --ink:#151A2E;
    --ink-soft:#4B5270;
    --sticker:#FFD23F;
    --sleeve:rgba(255,255,255,.055);
    --sleeve-edge:rgba(255,255,255,.14);
    --display:'Anybody','Arial Narrow',sans-serif;
    --body:'Atkinson Hyperlegible',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{color-scheme:dark;}
  body{margin:0; background:var(--cobalt); color:var(--on-cobalt); font-family:var(--body);
       font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
       padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  button{font:inherit; color:inherit; cursor:pointer;}
  :focus-visible{outline:3px solid var(--sticker); outline-offset:3px;}
  .wrap{max-width:1120px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); padding-block:18px 72px;}

  /* top bar */
  .topbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding-bottom:18px;}
  .wordmark{font-family:var(--display); font-weight:800; font-stretch:80%; font-size:20px; margin:0;}
  .tools{display:flex; flex-wrap:wrap; gap:8px;}
  .tool{background:transparent; border:1px solid var(--sleeve-edge); border-radius:999px; padding:8px 15px; font-size:14px;}
  .tool:hover{background:var(--sleeve);}

  /* hero: this week's card */
  .hero{display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:clamp(28px,6vw,72px); align-items:center; padding-block:14px 44px;}
  @media (max-width:720px){ .hero{grid-template-columns:1fr;} .feature-stage{justify-self:center;} }
  .feature-stage{perspective:900px; width:100%; max-width:300px;}
  .hero-copy{max-width:56ch;}
  .kicker{margin:0 0 6px; color:var(--on-cobalt-soft);}
  .hero h1{font-family:var(--display); font-weight:900; font-stretch:70%; font-size:clamp(38px,5.4vw,64px);
           line-height:.94; letter-spacing:-.01em; margin:0 0 14px; text-wrap:balance;}
  .hero .tagline{font-size:19px; margin:0 0 22px;}
  .try{background:var(--sleeve); border:1px solid var(--sleeve-edge); border-radius:14px; padding:15px 18px; margin:0 0 16px;}
  .try h2,.try h3{font-family:var(--display); font-stretch:85%; font-weight:700; font-size:17px; margin:0 0 4px;}
  .try p{margin:0; color:var(--on-cobalt-soft);}
  .btn{background:var(--sticker); color:var(--ink); border:none; border-radius:999px; padding:11px 20px; font-weight:700; font-size:15px;}
  .btn:hover{filter:brightness(1.06);}
  .copy-status{margin-left:12px; font-size:14px; color:var(--on-cobalt-soft);}
  .prompt-box{display:none; width:100%; margin-top:12px; min-height:100px; resize:vertical; background:var(--cobalt-deep);
              color:var(--on-cobalt); border:1px dashed var(--sleeve-edge); border-radius:10px; padding:10px 12px; font:14px/1.5 var(--body);}

  /* collection strip: one pocket per card */
  .progress{padding-block:22px 38px; border-top:1px solid var(--sleeve-edge);}
  .progress-head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 16px; margin-bottom:12px;}
  .progress h2,.fresh h2{font-family:var(--display); font-weight:800; font-stretch:80%; margin:0;}
  .progress h2{font-size:26px;}
  .progress p{margin:0; color:var(--on-cobalt-soft);}
  .pockets{display:grid; grid-template-columns:repeat(auto-fill,minmax(13px,1fr)); gap:5px;}
  .pocket-dot{aspect-ratio:63/88; border-radius:3px; border:1px solid var(--sleeve-edge);}
  .pocket-dot.got{background:var(--lc); border-color:transparent;}

  /* new / updated this week */
  .fresh{display:grid; grid-template-columns:1fr 1fr; gap:28px 36px; padding-bottom:42px;}
  @media (max-width:820px){ .fresh{grid-template-columns:1fr;} }
  .fresh h2{font-size:22px;}
  .fresh .sub{margin:2px 0 14px; color:var(--on-cobalt-soft); font-size:15px;}
  .mini-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:10px;}

  /* binder */
  .binder-bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--cobalt);
              display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding-block:12px; border-bottom:1px solid var(--sleeve-edge);}
  .find{flex:1 1 240px; min-width:0; background:var(--cobalt-deep); color:var(--on-cobalt); border:1px solid var(--sleeve-edge);
        border-radius:999px; padding:10px 16px; font:16px var(--body);}
  .find::placeholder{color:var(--on-cobalt-soft);}
  .tabs{display:flex; gap:6px; overflow-x:auto; max-width:100%; padding-bottom:2px;}
  .tab{white-space:nowrap; text-decoration:none; color:var(--on-cobalt-soft); font-size:14px; padding:6px 11px 5px;
       border:1px solid var(--sleeve-edge); border-bottom:3px solid var(--lc); border-radius:8px 8px 2px 2px;}
  .tab:hover{color:var(--on-cobalt); background:var(--sleeve);}
  .result-line{margin:10px 0 0; min-height:1.5em; color:var(--on-cobalt-soft); font-size:14px;}
  .page{padding-top:30px; scroll-margin-top:130px;}
  .page-head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 16px; margin-bottom:14px;}
  .page h2{display:flex; align-items:center; gap:10px; margin:0; font-family:var(--display); font-weight:800; font-stretch:78%; font-size:30px;}
  .page h2::before{content:""; width:12px; height:12px; border-radius:3px; background:var(--lc); flex-shrink:0;}
  .page-count{color:var(--on-cobalt-soft);}
  .sheet{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .sleeve{position:relative; background:var(--sleeve); border:1px solid var(--sleeve-edge); border-radius:12px; padding:7px;}
  .sleeve::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
                 background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.07) 47%,transparent 54%);}
  .sticker{position:absolute; top:-7px; left:-5px; z-index:2; background:var(--sticker); color:var(--ink);
           font-weight:700; font-size:12px; padding:2px 9px; border-radius:999px; transform:rotate(-8deg);}
  .empty-note{margin:0; color:var(--on-cobalt-soft);}

  /* the card */
  .tcg{all:unset; box-sizing:border-box; position:relative; display:block; width:100%; aspect-ratio:63/88;
       border-radius:9px; cursor:pointer; container-type:inline-size;}
  .tcg:focus-visible{outline:3px solid var(--sticker); outline-offset:3px;}
  .face,.backside{position:absolute; inset:0; border-radius:inherit; overflow:hidden;}
  .face{display:flex; padding:4.5cqw; background:var(--lc);}
  .frame{flex:1; min-height:0; display:flex; flex-direction:column; gap:3cqw; padding:4cqw; border-radius:5cqw; background:var(--stock); color:var(--ink);}
  .head{display:flex; justify-content:space-between; align-items:flex-start; gap:3cqw;}
  .name{font-family:var(--display); font-weight:800; font-stretch:66%; font-size:max(12px,11cqw); line-height:1;}
  .sym{flex-shrink:0; font-size:9cqw; line-height:1; color:var(--lc);}
  .art{flex:1 1 auto; min-height:20cqw; border-radius:3cqw; background-color:color-mix(in srgb,var(--lc) 30%,var(--stock));}
  .art.p0{background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--lc) 55%,transparent) 0 3cqw,transparent 3cqw 7cqw);}
  .art.p1{background-image:radial-gradient(color-mix(in srgb,var(--lc) 75%,transparent) 1.6cqw,transparent 1.9cqw); background-size:8cqw 8cqw;}
  .art.p2{background-image:repeating-radial-gradient(circle at 30% 70%,color-mix(in srgb,var(--lc) 60%,transparent) 0 1.4cqw,transparent 1.4cqw 5cqw);}
  .art.p3{background-image:linear-gradient(color-mix(in srgb,var(--lc) 55%,transparent) 1px,transparent 1px),
                           linear-gradient(90deg,color-mix(in srgb,var(--lc) 55%,transparent) 1px,transparent 1px); background-size:7cqw 7cqw;}
  .text{font-size:max(10px,6.8cqw); line-height:1.3; color:var(--ink-soft); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .foot{display:flex; justify-content:space-between; gap:4px; font-size:max(9.5px,5.8cqw); color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .tcg.mini .text{display:none;}
  .backside{display:none; flex-direction:column; align-items:center; justify-content:center; gap:6cqw; padding:8cqw;
            background-color:var(--cobalt-deep); border:4cqw solid #28397F;
            background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px),
                             repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px);}
  .seal{width:36cqw; aspect-ratio:1; display:grid; place-items:center; border-radius:50%; border:2px solid var(--on-cobalt-soft);
        font-family:var(--display); font-weight:900; font-stretch:70%; font-size:18cqw; color:var(--on-cobalt-soft);}
  .backname{font-size:max(11px,8.5cqw); line-height:1.2; text-align:center; color:var(--on-cobalt-soft);}
  .tcg.unopened .face{display:none;}
  .tcg.unopened .backside{display:flex;}

  /* foil: rare, legendary, and this week's card */
  .frame{position:relative; z-index:1;}
  .art{position:relative; overflow:hidden;}
  .tcg.r-Rare .face::after, .tcg.r-Legendary .face::after, #stage .tcg .face::after,
  .tcg.r-Rare .art::after, .tcg.r-Legendary .art::after, #stage .tcg .art::after{
    content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:color-dodge; opacity:.32;
    background:linear-gradient(115deg,transparent 18%,#7FE3F0 36%,#F08AD2 50%,#F2D16B 64%,transparent 82%);
    background-size:240% 240%; background-position:var(--foil-x,50%) var(--foil-y,50%);}
  .tcg.r-Legendary .face::after, #stage .tcg .face::after,
  .tcg.r-Legendary .art::after, #stage .tcg .art::after{opacity:.6;}
  #stage .tcg{transition:transform .2s ease-out;}

  /* card viewer */
  dialog.viewer{width:min(960px,calc(100vw - 24px)); max-height:calc(100dvh - 24px); padding:0; border:none; border-radius:18px;
                background:var(--stock); color:var(--ink); overflow:auto;}
  dialog.viewer::backdrop{background:rgba(9,14,38,.75);}
  .viewer-bar{position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px;
              padding:12px 18px; background:var(--stock); border-bottom:1px solid #DCE1EF;}
  .viewer-bar button{background:transparent; border:1px solid #C8D0E6; border-radius:999px; padding:7px 14px; font-size:14px; color:var(--ink);}
  .viewer-bar button:disabled{opacity:.4; cursor:default;}
  .stepper{display:flex; align-items:center; gap:8px;}
  .pos{font-size:14px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .viewer-grid{display:grid; grid-template-columns:minmax(200px,290px) 1fr; gap:34px; padding:28px;}
  @media (max-width:700px){ .viewer-grid{grid-template-columns:1fr; gap:22px; padding:20px;} .viewer-card{width:100%; max-width:230px; margin:0 auto;} }
  .viewer-body{max-width:62ch;}
  .meta-line{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px;}
  .chip{font-size:13px; padding:3px 10px; border-radius:999px; background:#E3E7F3;}
  .chip.layer{background:color-mix(in srgb,var(--lc) 20%,white);}
  .chip.got{background:var(--sticker);}
  .viewer h2{font-family:var(--display); font-weight:900; font-stretch:70%; font-size:clamp(34px,5vw,54px); line-height:.96; margin:0 0 8px; text-wrap:balance;}
  .viewer .tagline{font-size:18px; color:var(--ink-soft); margin:0 0 16px;}
  .viewer p{margin:0 0 16px;}
  .viewer h3{font-family:var(--display); font-weight:700; font-stretch:85%; font-size:17px; margin:22px 0 6px;}
  .viewer ul{margin:0; padding-left:20px;}
  .viewer li{margin:3px 0;}
  .note{border-left:3px solid var(--lc); padding:2px 0 2px 14px; font-style:italic;}
  .sources{font-size:14px; color:var(--ink-soft);}
  .viewer .try{background:#E7EBF7; border-color:#D1D8EC; margin-top:22px;}
  .viewer .try p{color:var(--ink-soft); margin:0;}
  .viewer .try h3{margin:0 0 4px;}
  .viewer .copy-status{color:var(--ink-soft);}
  .viewer .prompt-box{background:#fff; color:var(--ink); border-color:#BFC8E2;}
  @keyframes collect{from{transform:rotateY(180deg) scale(.94);} to{transform:none;}}
  .viewer-card{perspective:900px;}
  .viewer-card .tcg.collecting{animation:collect .6s cubic-bezier(.2,.7,.2,1);}

  /* quiz */
  .quiz-band{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px 28px;
             padding:22px 24px; margin-bottom:44px; border-radius:16px; background:var(--cobalt-deep); border:1px solid var(--sleeve-edge);}
  .quiz-band h2{font-family:var(--display); font-weight:800; font-stretch:80%; font-size:24px; margin:0 0 2px;}
  .quiz-band p{margin:0; max-width:60ch; color:var(--on-cobalt-soft);}
  .quiz-body{padding:26px 28px 32px; max-width:800px;}
  .viewer .quiz-body h2{font-size:clamp(28px,4vw,40px); line-height:1;}
  @media (max-width:560px){ .quiz-body{padding:20px;} }
  .viewer a{color:var(--ink); text-underline-offset:3px;}
  .scenario{font-size:17px; line-height:1.6;}
  .source-line{font-size:14px; color:var(--ink-soft);}
  .viewer h3.question{font-size:21px; margin:22px 0 12px;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:560px){ .options{grid-template-columns:1fr;} }
  .option{display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left; background:#fff; color:var(--ink);
          border:1px solid #CBD2E6; border-left:6px solid var(--lc); border-radius:10px; padding:12px 14px;}
  .option:hover:not(:disabled){border-color:var(--ink-soft); border-left-color:var(--lc);}
  .option:disabled{cursor:default;}
  .opt-name{font-family:var(--display); font-weight:800; font-stretch:75%; font-size:19px; line-height:1.05;}
  .opt-tag{display:none; font-size:14px; color:var(--ink-soft);}
  .options.answered .opt-tag{display:block;}
  .opt-flag{margin-top:6px; font-size:13px; font-weight:700;}
  .option.correct{box-shadow:0 0 0 3px var(--sticker); border-color:transparent;}
  .option.picked-wrong .opt-flag{color:#9B2C2C;}
  .option.faded{opacity:.5;}
  .viewer p.verdict{font-size:18px; margin:22px 0 8px;}
  .feedback h4{font-family:var(--display); font-weight:700; font-stretch:85%; font-size:16px; margin:18px 0 4px;}
  .quiz-actions{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin-top:22px;}
  .link-btn{background:none; border:none; padding:4px 0; color:var(--ink); text-decoration:underline; text-underline-offset:3px;}

  .foot-note{margin:60px 0 0; max-width:70ch; font-size:14px; color:var(--on-cobalt-soft);}

  @media (prefers-reduced-motion: reduce){
    #stage .tcg{transition:none;}
    .viewer-card .tcg.collecting{animation:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <p class="wordmark">Foundry Field Guide</p>
    <div class="tools">
      <button class="tool" id="quizBtn" type="button" hidden>Take the quiz</button>
      <button class="tool" id="randomBtn" type="button">Pull a random card</button>
      <button class="tool" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    </div>
  </header>

  <section class="hero" id="hero"></section>

  <section class="progress" aria-labelledby="progressTitle">
    <div class="progress-head">
      <h2 id="progressTitle">Your collection</h2>
      <p id="progressText"></p>
    </div>
    <div class="pockets" id="pockets" aria-hidden="true"></div>
  </section>

  <section class="quiz-band" id="quizBand" hidden aria-labelledby="quizBandTitle">
    <div>
      <h2 id="quizBandTitle">Play the right card</h2>
      <p id="quizBandText"></p>
    </div>
    <button class="btn" type="button" id="quizStart">Start the quiz</button>
  </section>

  <section class="fresh">
    <div>
      <h2>New this week</h2>
      <p class="sub" id="newSub"></p>
      <div class="mini-row" id="newRow"></div>
    </div>
    <div>
      <h2>Updated this week</h2>
      <p class="sub" id="updSub"></p>
      <div class="mini-row" id="updRow"></div>
    </div>
  </section>

  <div class="binder-bar">
    <input class="find" id="find" type="search" placeholder="Find a card by name or capability" autocomplete="off" aria-label="Find a card">
    <nav class="tabs" id="tabs" aria-label="Jump to a layer"></nav>
  </div>
  <p class="result-line" id="resultLine" aria-live="polite"></p>
  <div id="binder"></div>

  <p class="foot-note">Built <span id="genDate"></span> from Palantir docs, DevCon talks, release notes, the engineering blog, and community threads. Opening a card collects it. Your collection is saved in this browser only.</p>
</div>

<dialog class="viewer" id="viewer" aria-labelledby="viewerName">
  <div class="viewer-bar">
    <button type="button" id="closeBtn">Close</button>
    <div class="stepper">
      <button type="button" id="prevBtn">Previous</button>
      <span class="pos" id="pos"></span>
      <button type="button" id="nextBtn">Next</button>
    </div>
  </div>
  <div class="viewer-grid">
    <div class="viewer-card" id="viewerCard"></div>
    <div class="viewer-body" id="viewerBody"></div>
  </div>
</dialog>

<dialog class="viewer" id="quiz" aria-labelledby="quizTitle">
  <div class="viewer-bar">
    <button type="button" id="quizClose">Close</button>
    <span class="pos" id="quizPos"></span>
  </div>
  <div class="quiz-body" id="quizBody"></div>
</dialog>

ll Git version control, PR review, IntelliSense, and CI/CD. The Python path is the most full-featured (@transform.using, PySpark/Pandas/Polars/DuckDB, incremental computation, external API calls).", "marks": ["Git branching + PR review", "IntelliSense/error-check", "CI/CD", "Incremental computation"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "code-repositories-overview.md"}, {"label": "docs", "ref": "transforms-python-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Code Repositories on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 3, "id": "global-branching", "name": "Global Branching", "layer": "data", "tagline": "Branch, review, and merge changes across the whole platform.", "description": "Cross-platform branching so changes to data, ontology, and logic can be proposed and merged like code. Reached General Availability for all users on all enrollments the week of May 18, 2026. On September 17, 2026 the proposal page gained a Changes tab: reviewers can see every modified resource's diff, checks, and approval status in one place and approve or reject from there, instead of opening each resource's own application (change viewers exclude Workshop, Pipeline Builder, and AIP Logic).", "marks": ["Cross-platform (not just code repos)", "Full-fidelity branch/review/merge", "Centralized Changes tab on proposals (Sept 2026) - Workshop, Pipeline Builder, AIP Logic excluded"], "status": "GA, May 18, 2026", "rarity": "Common", "firstObserved": "releases/2026-05.md", "sources": [{"label": "releases", "ref": "2026-05.md"}, {"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Add one new property to an existing object type AND the pipeline column that backs it, on a single Global Branch + Proposal - the exact atomic use case this feature exists for. Then review your own proposal from the Changes tab and note which of your changes it shows a diff for and which it doesn't.", "fieldNote": "Merged branches still don't show an interactive diff of what actually landed, just a link to the closed proposal - keep your own note of what a branch changed until that's fixed."}, {"n": 4, "id": "sql-studio", "name": "SQL Studio", "layer": "data", "tagline": "Interactive SQL across tabular data and Ontology objects.", "description": "A dedicated Foundry application for writing and running SQL queries, spanning both raw tabular datasets and Ontology object types in one interface. Built on two engines (Furnace for tabular data, Ontology SQL for objects), with read/write support and publishable SQL functions. Entered beta in May 2026 and reached General Availability the week of June 15, 2026.", "marks": ["Queries tabular + Ontology data together", "Furnace routes queries between Trino and Spark", "CREATE/INSERT/UPDATE/DELETE on Iceberg tables", "Shareable SQL worksheets"], "status": "GA, June 15, 2026", "rarity": "Common", "firstObserved": "releases/2026-05.md (beta), releases/2026-06.md (GA)", "sources": [{"label": "releases", "ref": "2026-05.md"}, {"label": "releases", "ref": "2026-06.md"}], "buildSuggestion": "Spend 30 minutes building something small with SQL Studio on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 5, "id": "federated-compute-pushdown", "name": "Federated Compute Pushdown (Snowflake/Databricks/BigQuery)", "layer": "data", "tagline": "Run pipeline compute inside an external warehouse while Foundry keeps orchestration and governance.", "description": "Pipeline Builder transforms on Foundry Iceberg tables can select an external-compute profile (e.g. Snowflake via Snowpark Connect) instead of Spark or single-node engines, so the query executes inside the external system while Foundry retains orchestration, governance, and lineage over the pipeline. Decouples the earlier requirement that data and compute be co-located in the same external system.", "marks": ["Snowpark Connect compute profile in Pipeline Builder", "Demoed end-to-end on an Iceberg-to-Iceberg pipeline", "'External queries' link jumps to the run in Snowflake", "Same pattern extends to Databricks/BigQuery virtual tables"], "status": "Shown at DevCon 5 (demoed working, no GA date stated)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "deep-dive-interoperability-at-scale-with-the-multimodal-data-plane-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Federated Compute Pushdown (Snowflake/Databricks/BigQuery) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 6, "id": "iceberg-lightweight-compute", "name": "Iceberg Tables + Lightweight Compute", "layer": "data", "tagline": "Optimizing pipelines with open table formats.", "description": "DevCon 4 deep-dive on using Apache Iceberg virtual tables paired with lightweight compute to cut pipeline cost/latency versus traditional Spark-heavy jobs. Community threads separately flag current limitations on Iceberg virtual-table writes.", "marks": ["Open table format (Iceberg)", "Lower-cost compute path", "Known limitation: write_table single-file output"], "status": "Shown at DevCon 4", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "deep-dive-optimizing-data-pipelines-with-iceberg-tables-and-lightweight-compute-"}, {"label": "community", "ref": "6304 / 5467"}], "buildSuggestion": "Spend 30 minutes building something small with Iceberg Tables + Lightweight Compute on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 7, "id": "iceberg-tables", "name": "Managed Iceberg Tables & Iceberg REST Catalog", "layer": "data", "tagline": "Open-format tables with row-level updates, Foundry governance, and an external-facing catalog.", "description": "Managed Apache Iceberg tables and Palantir's Iceberg REST catalog, usable from Python transforms, Pipeline Builder, Data Connection syncs (Custom JDBC, SQL Server, Oracle, PostgreSQL, Snowflake), Ontology object types, Contour, and SQL. Adds row-level insert/update/delete, changelog-based incremental pipelines, maintenance procedures (compaction, snapshot expiry), and bring-your-own storage buckets. Generally available on AWS, Azure, and GCP enterprise environments as of September 15, 2026.", "marks": ["All-or-nothing transaction semantics across multi-write jobs", "Schema branch isolation - dev-branch schema changes can't hit consumers on main", "Credential vending: external clients authenticate via Foundry, markings enforced", "Palantir-managed or customer-provided storage"], "status": "GA, Sept 15, 2026", "rarity": "Common", "firstObserved": "releases/2026-09.md", "sources": [{"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Take one small existing dataset, land it as a managed Iceberg table, then run a single row-level update and open the snapshot history to see exactly what changed (file size, row count, operation). That before/after snapshot view is the concrete difference from a classic Foundry dataset.", "fieldNote": null}, {"n": 8, "id": "peer-manager", "name": "Peer Manager", "layer": "data", "tagline": "Real-time Ontology object/link sync across separate Foundry enrollments.", "description": "A dedicated application for creating, monitoring, and administering peering connections that synchronize Ontology objects and links (and object sets from Object Explorer) between distinct Foundry enrollments in real time. Entered beta the week of September 8, 2025 and reached General Availability across all enrollments the third week of November 2025.", "marks": ["Real-time cross-enrollment Ontology sync", "Per-property peering configuration", "Central home for monitoring peering-job health", "Artifact peering still on the roadmap as of GA"], "status": "GA, Nov 2025", "rarity": "Common", "firstObserved": "releases/2025-09.md", "sources": [{"label": "releases", "ref": "2025-09.md"}, {"label": "releases", "ref": "2025-11.md"}], "buildSuggestion": "If you have (or can spin up) a second Foundry enrollment, peer one small object type between the two and watch an edit made on one side show up on the other - that round trip is the entire value proposition in a single click.", "fieldNote": null}, {"n": 9, "id": "object-link-action-types", "name": "Object, Link & Action Types", "layer": "ontology", "tagline": "The semantic backbone: objects, relationships, and the write-back layer.", "description": "Object types model real-world entities, link types model relationships between them, and Action types are how humans or agents write back to the operational world. Together they're the Ontology's grounding vocabulary, shared by every app and agent.", "marks": ["Object types ≠ tables", "Action types = write-back, not just data"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "object-link-types / action-types-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Object, Link & Action Types on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 10, "id": "interfaces", "name": "Interfaces", "layer": "ontology", "tagline": "Shared contracts across object types.", "description": "A typed contract layer letting multiple object types share common properties and behavior, so applications and agents can be written against the interface rather than every concrete object type.", "marks": ["Cross-object-type polymorphism", "Reduces app-side type-checking"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "interfaces-interface-overvie he description.", "fieldNote": null}, {"n": 13, "id": "scenario-simulation", "name": "Scenario Simulation", "layer": "ontology", "tagline": "Fork the operational world to simulate cascading consequences.", "description": "Stacked Scenario 1/2/3 layers of the same decision space, each a fork for what-if simulation of cascading real-world consequences before acting — beyond atomic transactions or code commits.", "marks": ["Multiple parallel scenario forks", "Simulates cascading, not just point, effects", "Concrete demo: data-persistent sandbox with submit-for-approval + approve-and-merge"], "status": "Shown at DevCon 5 (vision talk + concrete demo, Ontology Scenarios in the Ontology Foundations session)", "rarity": "Rare", "firstObserved": "DevCon 5 opening keynote", "sources": [{"label": "devcon5", "ref": "akshay-krishnaswamy-opening-remarks-devcon-5"}, {"label": "devcon5", "ref": "product-launch-ontology-foundations-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Scenario Simulation on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 14, "id": "knowledge-nodes", "name": "Knowledge Nodes (Advanced Agent Reasoning)", "layer": "ontology", "tagline": "Structuring institutional knowledge for agent reasoning.", "description": "DevCon 4 deep-dive (with First Solar) on Knowledge Nodes as a way to encode institutional/tribal knowledge into the Ontology so agents can reason over it reliably.", "marks": ["Customer case study: First Solar", "Targets agent reasoning reliability"], "status": "Shown at DevCon 4", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "deep-dive-advanced-agent-reasoning-with-knowledge-nodes-x-first-solar-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Knowledge Nodes (Advanced Agent Reasoning) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 15, "id": "object-property-security", "name": "Object & Property Security Policies", "layer": "ontology", "tagline": "Fine-grained permissions inside Ontology Manager.", "description": "Define permissions at the object-type and individual-property level directly in Ontology Manager. Reached GA across Foundry enrollments in April 2026.", "marks": ["Property-level (not just object-level) permissions"], "status": "GA, April 2026", "rarity": "Common", "firstObserved": "releases/2026-04.md", "sources": [{"label": "releases", "ref": "2026-04.md"}], "buildSuggestion": "Spend 30 minutes building something small with Object & Property Security Policies on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 16, "id": "ontology-backed-apps", "name": "Ontology-backed App Building", "layer": "ontology", "tagline": "Apps built natively on Ontology primitives.", "description": "DevCon 4 product launch for building applications directly on top of Ontology objects/links/actions rather than bespoke data models.", "marks": ["App layer talks directly to Ontology primitives"], "status": "Shown at DevCon 4 (product launch)", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "product-launch-ontology-backed-app-building-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Ontology-backed App Building on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 17, "id": "ontology-structs", "name": "Structs (Composite Properties)", "layer": "ontology", "tagline": "A single property holding multiple named sub-fields, reducible to one value or one 'main field.'", "description": "Ports Gotham's composite-properties concept to Foundry: one property (e.g. Address) holds several named sub-fields (Street, City, State, Postal Code), configured in king example teaches more than reading the description.", "fieldNote": null}, {"n": 19, "id": "core-object-views", "name": "Core Object Views", "layer": "ontology", "tagline": "Every object type gets a usable default view for free, no Workshop config needed.", "description": "Foundry now auto-generates a standardized Object View for every object type at creation time, surfacing prominent properties (with type-aware rendering — media viewer, Quiver time-series charts, map for geospatial) and linked objects grouped by link type, with no builder configuration required. Custom Object Views built in Workshop still take precedence when present, and users can toggle between core and custom views. Reached General Availability February 19, 2026.", "marks": ["Zero-config default view per object type", "Type-aware rendering (media/time-series/geospatial)", "Linked-objects browser grouped by link type", "Coexists with, and is overridden by, custom Workshop Object Views"], "status": "GA, Feb 19, 2026", "rarity": "Common", "firstObserved": "releases/2026-02.md", "sources": [{"label": "releases", "ref": "2026-02.md"}], "buildSuggestion": "Open the core Object View on an object type you haven't built a custom view for yet, and note what Foundry chose to surface by default versus what you'd actually want a user to see - that gap is exactly what a custom Object View is for.", "fieldNote": null}, {"n": 20, "id": "functions-ts-python", "name": "Functions (TypeScript v1/v2, Python)", "layer": "functions", "tagline": "Typed logic callable from Workshop, OSDK, and AIP.", "description": "Function-backed columns and Action types, written in TypeScript (v1 or v2) or Python, callable across Workshop, OSDK apps, and AIP tooling.", "marks": ["Function-backed columns", "Function-backed Action types", "TS v1 vs v2 getting-started paths"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "functions-overview.md + typescript/python gett
