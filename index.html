<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundry Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cobalt:#1E2D6B;
    --cobalt-deep:#131D4A;
    --on-cobalt:#E9EDFB;
    --on-cobalt-soft:#AEB8DE;
    --stock:#F4F6FB;
    --ink:#151A2E;
    --ink-soft:#4B5270;
    --sticker:#FFD23F;
    --sleeve:rgba(255,255,255,.055);
    --sleeve-edge:rgba(255,255,255,.14);
    --display:'Anybody','Arial Narrow',sans-serif;
    --body:'Atkinson Hyperlegible',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{margin:0; background:var(--cobalt); color:var(--on-cobalt); font-family:var(--body);
       font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
       padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  button{font:inherit; color:inherit; cursor:pointer;}
  :focus-visible{outline:3px solid var(--sticker); outline-offset:3px;}
  .wrap{max-width:1120px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); padding-block:18px 72px;}

  /* top bar */
  .topbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding-bottom:18px;}
  .wordmark{font-family:var(--display); font-weight:800; font-stretch:80%; font-size:20px; margin:0;}
  .tools{display:flex; flex-wrap:wrap; gap:8px;}
  .tool{background:transparent; border:1px solid var(--sleeve-edge); border-radius:999px; padding:8px 15px; font-size:14px;}
  .tool:hover{background:var(--sleeve);}

  /* hero: this week's card */
  .hero{display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:clamp(28px,6vw,72px); align-items:center; padding-block:14px 44px;}
  @media (max-width:720px){ .hero{grid-template-columns:1fr;} .feature-stage{justify-self:center;} }
  .feature-stage{perspective:900px; width:100%; max-width:300px;}
  .hero-copy{max-width:56ch;}
  .kicker{margin:0 0 6px; color:var(--on-cobalt-soft);}
  .hero h1{font-family:var(--display); font-weight:900; font-stretch:70%; font-size:clamp(38px,5.4vw,64px);
           line-height:.94; letter-spacing:-.01em; margin:0 0 14px; text-wrap:balance;}
  .hero .tagline{font-size:19px; margin:0 0 22px;}
  .try{background:var(--sleeve); border:1px solid var(--sleeve-edge); border-radius:14px; padding:15px 18px; margin:0 0 16px;}
  .try h2,.try h3{font-family:var(--display); font-stretch:85%; font-weight:700; font-size:17px; margin:0 0 4px;}
  .try p{margin:0; color:var(--on-cobalt-soft);}
  .btn{background:var(--sticker); color:var(--ink); border:none; border-radius:999px; padding:11px 20px; font-weight:700; font-size:15px;}
  .btn:hover{filter:brightness(1.06);}
  .copy-status{margin-left:12px; font-size:14px; color:var(--on-cobalt-soft);}
  .prompt-box{display:none; width:100%; margin-top:12px; min-height:100px; resize:vertical; background:var(--cobalt-deep);
              color:var(--on-cobalt); border:1px dashed var(--sleeve-edge); border-radius:10px; padding:10px 12px; font:14px/1.5 var(--body);}

  /* collection strip: one pocket per card */
  .progress{padding-block:22px 38px; border-top:1px solid var(--sleeve-edge);}
  .progress-head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 16px; margin-bottom:12px;}
  .progress h2,.fresh h2{font-family:var(--display); font-weight:800; font-stretch:80%; margin:0;}
  .progress h2{font-size:26px;}
  .progress p{margin:0; color:var(--on-cobalt-soft);}
  .pockets{display:grid; grid-template-columns:repeat(auto-fill,minmax(13px,1fr)); gap:5px;}
  .pocket-dot{aspect-ratio:63/88; border-radius:3px; border:1px solid var(--sleeve-edge);}
  .pocket-dot.got{background:var(--lc); border-color:transparent;}

  /* new / updated this week */
  .fresh{display:grid; grid-template-columns:1fr 1fr; gap:28px 36px; padding-bottom:42px;}
  @media (max-width:820px){ .fresh{grid-template-columns:1fr;} }
  .fresh h2{font-size:22px;}
  .fresh .sub{margin:2px 0 14px; color:var(--on-cobalt-soft); font-size:15px;}
  .mini-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:10px;}

  /* binder */
  .binder-bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--cobalt);
              display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding-block:12px; border-bottom:1px solid var(--sleeve-edge);}
  .find{flex:1 1 240px; min-width:0; background:var(--cobalt-deep); color:var(--on-cobalt); border:1px solid var(--sleeve-edge);
        border-radius:999px; padding:10px 16px; font:16px var(--body);}
  .find::placeholder{color:var(--on-cobalt-soft);}
  .tabs{display:flex; gap:6px; overflow-x:auto; max-width:100%; padding-bottom:2px;}
  .tab{white-space:nowrap; text-decoration:none; color:var(--on-cobalt-soft); font-size:14px; padding:6px 11px 5px;
       border:1px solid var(--sleeve-edge); border-bottom:3px solid var(--lc); border-radius:8px 8px 2px 2px;}
  .tab:hover{color:var(--on-cobalt); background:var(--sleeve);}
  .result-line{margin:10px 0 0; min-height:1.5em; color:var(--on-cobalt-soft); font-size:14px;}
  .page{padding-top:30px; scroll-margin-top:130px;}
  .page-head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 16px; margin-bottom:14px;}
  .page h2{display:flex; align-items:center; gap:10px; margin:0; font-family:var(--display); font-weight:800; font-stretch:78%; font-size:30px;}
  .page h2::before{content:""; width:12px; height:12px; border-radius:3px; background:var(--lc); flex-shrink:0;}
  .page-count{color:var(--on-cobalt-soft);}
  .sheet{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .sleeve{position:relative; background:var(--sleeve); border:1px solid var(--sleeve-edge); border-radius:12px; padding:7px;}
  .sleeve::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
                 background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.07) 47%,transparent 54%);}
  .sticker{position:absolute; top:-7px; left:-5px; z-index:2; background:var(--sticker); color:var(--ink);
           font-weight:700; font-size:12px; padding:2px 9px; border-radius:999px; transform:rotate(-8deg);}
  .empty-note{margin:0; color:var(--on-cobalt-soft);}

  /* the card */
  .tcg{all:unset; box-sizing:border-box; position:relative; display:block; width:100%; aspect-ratio:63/88;
       border-radius:9px; cursor:pointer; container-type:inline-size;}
  .tcg:focus-visible{outline:3px solid var(--sticker); outline-offset:3px;}
  .face,.backside{position:absolute; inset:0; border-radius:inherit; overflow:hidden;}
  .face{display:flex; padding:4.5cqw; background:var(--lc);}
  .frame{flex:1; min-height:0; display:flex; flex-direction:column; gap:3cqw; padding:4cqw; border-radius:5cqw; background:var(--stock); color:var(--ink);}
  .head{display:flex; justify-content:space-between; align-items:flex-start; gap:3cqw;}
  .name{font-family:var(--display); font-weight:800; font-stretch:66%; font-size:max(12px,11cqw); line-height:1;}
  .sym{flex-shrink:0; font-size:9cqw; line-height:1; color:var(--lc);}
  .art{flex:1 1 auto; min-height:20cqw; border-radius:3cqw; background-color:color-mix(in srgb,var(--lc) 30%,var(--stock));}
  .art.p0{background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--lc) 55%,transparent) 0 3cqw,transparent 3cqw 7cqw);}
  .art.p1{background-image:radial-gradient(color-mix(in srgb,var(--lc) 75%,transparent) 1.6cqw,transparent 1.9cqw); background-size:8cqw 8cqw;}
  .art.p2{background-image:repeating-radial-gradient(circle at 30% 70%,color-mix(in srgb,var(--lc) 60%,transparent) 0 1.4cqw,transparent 1.4cqw 5cqw);}
  .art.p3{background-image:linear-gradient(color-mix(in srgb,var(--lc) 55%,transparent) 1px,transparent 1px),
                           linear-gradient(90deg,color-mix(in srgb,var(--lc) 55%,transparent) 1px,transparent 1px); background-size:7cqw 7cqw;}
  .text{font-size:max(10px,6.8cqw); line-height:1.3; color:var(--ink-soft); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .foot{display:flex; justify-content:space-between; gap:4px; font-size:max(9.5px,5.8cqw); color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .tcg.mini .text{display:none;}
  .backside{display:none; flex-direction:column; align-items:center; justify-content:center; gap:6cqw; padding:8cqw;
            background-color:var(--cobalt-deep); border:4cqw solid #28397F;
            background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px),
                             repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px);}
  .seal{width:36cqw; aspect-ratio:1; display:grid; place-items:center; border-radius:50%; border:2px solid var(--on-cobalt-soft);
        font-family:var(--display); font-weight:900; font-stretch:70%; font-size:18cqw; color:var(--on-cobalt-soft);}
  .backname{font-size:max(11px,8.5cqw); line-height:1.2; text-align:center; color:var(--on-cobalt-soft);}
  .tcg.unopened .face{display:none;}
  .tcg.unopened .backside{display:flex;}

  /* foil: rare, legendary, and this week's card */
  .frame{position:relative; z-index:1;}
  .art{position:relative; overflow:hidden;}
  .tcg.r-Rare .face::after, .tcg.r-Legendary .face::after, #stage .tcg .face::after,
  .tcg.r-Rare .art::after, .tcg.r-Legendary .art::after, #stage .tcg .art::after{
    content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:color-dodge; opacity:.32;
    background:linear-gradient(115deg,transparent 18%,#7FE3F0 36%,#F08AD2 50%,#F2D16B 64%,transparent 82%);
    background-size:240% 240%; background-position:var(--foil-x,50%) var(--foil-y,50%);}
  .tcg.r-Legendary .face::after, #stage .tcg .face::after,
  .tcg.r-Legendary .art::after, #stage .tcg .art::after{opacity:.6;}
  #stage .tcg{transition:transform .2s ease-out;}

  /* card viewer */
  dialog.viewer{width:min(960px,calc(100vw - 24px)); max-height:calc(100dvh - 24px); padding:0; border:none; border-radius:18px;
                background:var(--stock); color:var(--ink); overflow:auto;}
  dialog.viewer::backdrop{background:rgba(9,14,38,.75);}
  .viewer-bar{position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px;
              padding:12px 18px; background:var(--stock); border-bottom:1px solid #DCE1EF;}
  .viewer-bar button{background:transparent; border:1px solid #C8D0E6; border-radius:999px; padding:7px 14px; font-size:14px; color:var(--ink);}
  .viewer-bar button:disabled{opacity:.4; cursor:default;}
  .stepper{display:flex; align-items:center; gap:8px;}
  .pos{font-size:14px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .viewer-grid{display:grid; grid-template-columns:minmax(200px,290px) 1fr; gap:34px; padding:28px;}
  @media (max-width:700px){ .viewer-grid{grid-template-columns:1fr; gap:22px; padding:20px;} .viewer-card{width:100%; max-width:230px; margin:0 auto;} }
  .viewer-body{max-width:62ch;}
  .meta-line{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px;}
  .chip{font-size:13px; padding:3px 10px; border-radius:999px; background:#E3E7F3;}
  .chip.layer{background:color-mix(in srgb,var(--lc) 20%,white);}
  .chip.got{background:var(--sticker);}
  .viewer h2{font-family:var(--display); font-weight:900; font-stretch:70%; font-size:clamp(34px,5vw,54px); line-height:.96; margin:0 0 8px; text-wrap:balance;}
  .viewer .tagline{font-size:18px; color:var(--ink-soft); margin:0 0 16px;}
  .viewer p{margin:0 0 16px;}
  .viewer h3{font-family:var(--display); font-weight:700; font-stretch:85%; font-size:17px; margin:22px 0 6px;}
  .viewer ul{margin:0; padding-left:20px;}
  .viewer li{margin:3px 0;}
  .note{border-left:3px solid var(--lc); padding:2px 0 2px 14px; font-style:italic;}
  .sources{font-size:14px; color:var(--ink-soft);}
  .viewer .try{background:#E7EBF7; border-color:#D1D8EC; margin-top:22px;}
  .viewer .try p{color:var(--ink-soft); margin:0;}
  .viewer .try h3{margin:0 0 4px;}
  .viewer .copy-status{color:var(--ink-soft);}
  .viewer .prompt-box{background:#fff; color:var(--ink); border-color:#BFC8E2;}
  @keyframes collect{from{transform:rotateY(180deg) scale(.94);} to{transform:none;}}
  .viewer-card{perspective:900px;}
  .viewer-card .tcg.collecting{animation:collect .6s cubic-bezier(.2,.7,.2,1);}

  .foot-note{margin:60px 0 0; max-width:70ch; font-size:14px; color:var(--on-cobalt-soft);}

  @media (prefers-reduced-motion: reduce){
    #stage .tcg{transition:none;}
    .viewer-card .tcg.collecting{animation:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <p class="wordmark">Foundry Field Guide</p>
    <div class="tools">
      <button class="tool" id="randomBtn" type="button">Pull a random card</button>
      <button class="tool" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    </div>
  </header>

  <section class="hero" id="hero"></section>

  <section class="progress" aria-labelledby="progressTitle">
    <div class="progress-head">
      <h2 id="progressTitle">Your collection</h2>
      <p id="progressText"></p>
    </div>
    <div class="pockets" id="pockets" aria-hidden="true"></div>
  </section>

  <section class="fresh">
    <div>
      <h2>New this week</h2>
      <p class="sub" id="newSub"></p>
      <div class="mini-row" id="newRow"></div>
    </div>
    <div>
      <h2>Updated this week</h2>
      <p class="sub" id="updSub"></p>
      <div class="mini-row" id="updRow"></div>
    </div>
  </section>

  <div class="binder-bar">
    <input class="find" id="find" type="search" placeholder="Find a card by name or capability" autocomplete="off" aria-label="Find a card">
    <nav class="tabs" id="tabs" aria-label="Jump to a layer"></nav>
  </div>
  <p class="result-line" id="resultLine" aria-live="polite"></p>
  <div id="binder"></div>

  <p class="foot-note">Built <span id="genDate"></span> from Palantir docs, DevCon talks, release notes, the engineering blog, and community threads. Opening a card collects it. Your collection is saved in this browser only.</p>
</div>

<dialog class="viewer" id="viewer" aria-labelledby="viewerName">
  <div class="viewer-bar">
    <button type="button" id="closeBtn">Close</button>
    <div class="stepper">
      <button type="button" id="prevBtn">Previous</button>
      <span class="pos" id="pos"></span>
      <button type="button" id="nextBtn">Next</button>
    </div>
  </div>
  <div class="viewer-grid">
    <div class="viewer-card" id="viewerCard"></div>
    <div class="viewer-body" id="viewerBody"></div>
  </div>
</dialog>

: "GA, Nov 2025", "rarity": "Common", "firstObserved": "releases/2025-09.md", "sources": [{"label": "releases", "ref": "2025-09.md"}, {"label": "releases", "ref": "2025-11.md"}], "buildSuggestion": "If you have (or can spin up) a second Foundry enrollment, peer one small object type between the two and watch an edit made on one side show up on the other - that round trip is the entire value proposition in a single click.", "fieldNote": null}, {"n": 8, "id": "object-link-action-types", "name": "Object, Link & Action Types", "layer": "ontology", "tagline": "The semantic backbone: objects, relationships, and the write-back layer.", "description": "Object types model real-world entities, link types model relationships between them, and Action types are how humans or agents write back to the operational world. Together they're the Ontology's grounding vocabulary, shared by every app and agent.", "marks": ["Object types ≠ tables", "Action types = write-back, not just data"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "object-link-types / action-types-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Object, Link & Action Types on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 9, "id": "interfaces", "name": "Interfaces", "layer": "ontology", "tagline": "Shared contracts across object types.", "description": "A typed contract layer letting multiple object types share common properties and behavior, so applications and agents can be written against the interface rather than every concrete object type.", "marks": ["Cross-object-type polymorphism", "Reduces app-side type-checking"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "interfaces-interface-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Interfaces on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 10, "id": "ontology-best-practices", "name": "Ontology Best Practices & Anti-patterns", "layer": "ontology", "tagline": "Palantir's own opinionated design guidance.", "description": "A substantial (~19.5K-char) documented guide on how to design an ontology well, and the specific anti-patterns Palantir has seen customers fall into.", "marks": ["Official, opinionated (not just reference)", "Anti-pattern catalog included"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "ontology-ontology-best-practices-and-anti-patterns.md"}], "buildSuggestion": "Spend 30 minutes building something small with Ontology Best Practices & Anti-patterns on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 11, "id": "ontology-branching", "name": "Ontology Branching (sandbox evolution)", "layer": "ontology", "tagline": "Branch Object / Automation / Plan / Forecast — agents proposing changes safely.", "description": "Named branch types shown at DevCon 5's opening keynote: fleets of agents securely propose, review, and merge new ontology structure and outputs in sandboxes, at machine speed, with full auditing and guardrails.", "marks": ["Branch Object", "Branch Automation", "Branch Plan", "Branch Forecast", "Full audit trail"], "status": "Shown at DevCon 5 (framing/vision talk, no GA date stated)", "rarity": "Rare", "firstObserved": "DevCon 5 opening keynote", "sources": [{"label": "devcon5", "ref": "akshay-krishnaswamy-opening-remarks-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Ontology Branching (sandbox evolution) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 12, "id": "scenario-simulation", "name": "Scenario Simulation", "layer": "ontology", "tagline": "Fork the operational world to simulate cascading consequences.", "description": "Stacked Scenario 1/2/3 layers of the same decision space, each a fork for what-if simulation of cascading real-world consequences before acting — beyond atomic transactions or code commits.", "marks": ["Multiple parallel scenario forks", "Simulates cascading, not just point, effects", "Concrete demo: data-persistent sandbox with submit-for-approval + approve-and-merge"], "status": "Shown at DevCon 5 (vision talk + concrete demo, Ontology Scenarios in the Ontology Foundations session)", "rarity": "Rare", "firstObserved": "DevCon 5 opening keynote", "sources": [{"label": "devcon5", "ref": "akshay-krishnaswamy-opening-remarks-devcon-5"}, {"label": "devcon5", "ref": "product-launch-ontology-foundations-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Scenario Simulation on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 13, "id": "knowledge-nodes", "name": "Knowledge Nodes (Advanced Agent Reasoning)", "layer": "ontology", "tagline": "Structuring institutional knowledge for agent reasoning.", "description": "DevCon 4 deep-dive (with First Solar) on Knowledge Nodes as a way to encode institutional/tribal knowledge into the Ontology so agents can reason over it reliably.", "marks": ["Customer case study: First Solar", "Targets agent reasoning reliability"], "status": "Shown at DevCon 4", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "deep-dive-advanced-agent-reasoning-with-knowledge-nodes-x-first-solar-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Knowledge Nodes (Advanced Agent Reasoning) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 14, "id": "object-property-security", "name": "Object & Property Security Policies", "layer": "ontology", "tagline": "Fine-grained permissions inside Ontology Manager.", "description": "Define permissions at the object-type and individual-property level directly in Ontology Manager. Reached GA across Foundry enrollments in April 2026.", "marks": ["Property-level (not just object-level) permissions"], "status": "GA, April 2026", "rarity": "Common", "firstObserved": "releases/2026-04.md", "sources": [{"label": "releases", "ref": "2026-04.md"}], "buildSuggestion": "Spend 30 minutes building something small with Object & Property Security Policies on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 15, "id": "ontology-backed-apps", "name": "Ontology-backed App Building", "layer": "ontology", "tagline": "Apps built natively on Ontology primitives.", "description": "DevCon 4 product launch for building applications directly on top of Ontology objects/links/actions rather than bespoke data models.", "marks": ["App layer talks directly to Ontology primitives"], "status": "Shown at DevCon 4 (product launch)", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "product-launch-ontology-backed-app-building-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Ontology-backed App Building on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 16, "id": "ontology-structs", "name": "Structs (Composite Properties)", "layer": "ontology", "tagline": "A single property holding multiple named sub-fields, reducible to one value or one 'main field.'", "description": "Ports Gotham's composite-properties concept to Foundry: one property (e.g. Address) holds several named sub-fields (Street, City, State, Postal Code), configured in Pipeline Builder and rendered as a grouped field set in action forms. New array-reducer logic collapses a multi-value struct property to a single displayed value (e.g. 'most recent by Last Modified On'), and a new 'struct main field' designation lets a struct behave like a plain primitive (e.g. a geo point) everywhere else, with the rest of its metadata available on hover.", "marks": ["Struct creation tagged Experimental in Pipeline Builder", "Array reducers & struct main fields tagged 'Requires reindex' / 'Limited support'", "Also used to structure LLM/AIP Logic output"], "status": "Experimental, shown at DevCon 5", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "deep-dive-advanced-ontology-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Structs (Composite Properties) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 17, "id": "ontology-transactions", "name": "Transactions", "layer": "ontology", "tagline": "Bundle multiple Ontology actions into one atomic commit — all succeed or all roll back.", "description": "A primitive that lets a function bundle several Ontology actions (e.g. unassign-nurse + unassign-doctor + unassign-room-prep for a cancellation) so that either every action succeeds or, if any fails, all writes are rolled back and nothing is persisted. Aimed at cases where separate teams own separate actions/repos that one developer needs to compose without partial-failure risk.", "marks": ["All-run-or-all-fail semantics", "Composes actions owned by different teams/repos"], "status": "Shown at DevCon 5 (\"the feature we just built\", no GA date)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ontology-foundations-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Transactions on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 18, "id": "core-object-views", "name": "Core Object Views", "layer": "ontology", "tagline": "Every object type gets a usable default view for free, no Workshop config needed.", "description": "Foundry now auto-generates a standardized Object View for every object type at creation time, surfacing prominent properties (with type-aware rendering — media viewer, Quiver time-series charts, map for geospatial) and linked objects grouped by link type, with no builder configuration required. Custom Object Views built in Workshop still take precedence when present, and users can toggle between core and custom views. Reached General Availability February 19, 2026.", "marks": ["Zero-config default view per object type", "Type-aware rendering (media/time-series/geospatial)", "Linked-objects browser grouped by link type", "Coexists with, and is overridden by, custom Workshop Object Views"], "status": "GA, Feb 19, 2026", "rarity": "Common", "firstObserved": "releases/2026-02.md", "sources": [{"label": "releases", "ref": "2026-02.md"}], "buildSuggestion": "Open the core Object View on an object type you haven't built a custom view for yet, and note what Foundry chose to surface by default versus what you'd actually want a user to see - that gap is exactly what a custom Object View is for.", "fieldNote": null}, {"n": 19, "id": "functions-ts-python", "name": "Functions (TypeScript v1/v2, Python)", "layer": "functions", "tagline": "Typed logic callable from Workshop, OSDK, and AIP.", "description": "Function-backed columns and Action types, written in TypeScript (v1 or v2) or Python, callable across Workshop, OSDK apps, and AIP tooling.", "marks": ["Function-backed columns", "Function-backed Action types", "TS v1 vs v2 getting-started paths"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "functions-overview.md + typescript/python getting-started"}], "buildSuggestion": "Spend 30 minutes building something small with Functions (TypeScript v1/v2, Python) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 20, "id": "compute-modules", "name": "Compute Modules", "layer": "functions", "tagline": "Deploy arbitrary containers - any language - as scaling Foundry functions, pipelines, or APIs.", "description": "Run auto-scaling containers inside Foundry without rewriting existing code into a Foundry-supported language: back custom functions/APIs callable from Workshop, Slate, and OSDK; ingest external data into streams/datasets/media sets; or bring legacy business logic in as-is. Appeared as a used-in-production resource type in an early DevCon 4 solution-design demo, then reached General Availability the week of February 2, 2026.", "marks": ["Any language via containers", "Dynamic horizontal autoscaling", "Zero-downtime version updates", "Native Foundry dataset/Ontology/API connections", "Marketplace-shareable"], "status": "GA, Feb 2026", "rarity": "Common", "firstObserved": "DevCon 4 (Victus Technologies talk, used as a resource type)", "sources": [{"label": "devcon4", "ref": "startup-fellowship-victus-technologies-devcon-4"}, {"label": "releases", "ref": "2026-02.md"}], "buildSuggestion": "Containerize one small existing script - even a simple function that isn't Foundry-shaped - and deploy it as a Compute Module, then call it from a Workshop button. The point is feeling the 'bring code in as-is, no rewrite' promise firsthand.", "fieldNote": null}, {"n": 21, "id": "workshop", "name": "Workshop", "layer": "applications", "tagline": "Foundry's primary no-code application builder.", "description": "The main app-building surface: sections, filters, object lists, widgets, all wired to Ontology objects and Actions. AI FDE can now create and edit Workshop modules directly — called 'one of the most requested features' at DevCon 5.", "marks": ["Drag-and-drop layout", "Now AI-FDE-editable", "Widget library"] ": "Building structured, multi-step operational workflows.", "description": "DevCon 4 product launch for a builder aimed at structured, multi-step workflows rather than single-screen apps.", "marks": ["Multi-step, not single-screen", "Product-launch talk"], "status": "Shown at DevCon 4 (product launch)", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "product-launch-workflow-builder-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Workflow Builder on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 25, "id": "provider-api-proxy", "name": "Provider API Proxy", "layer": "applications", "tagline": "Proxying external provider APIs through Foundry's governance layer.", "description": "DevCon 4 product launch — lets external API calls (e.g. to model providers or partner systems) route through Foundry with its governance, auth, and observability intact.", "marks": ["External API calls under Foundry governance"], "status": "Shown at DevCon 4 (product launch)", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "product-launch-provider-api-proxy-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Provider API Proxy on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 26, "id": "partner-portals", "name": "Partner Portals & Public Dashboards", "layer": "applications", "tagline": "Extending Foundry apps to external, non-Foundry-licensed users.", "description": "DevCon 4 deep-dive on patterns for building portals and dashboards for external partners/the public who don't have Foundry seats.", "marks": ["External/public audience, not internal users"], "status": "Shown at DevCon 4", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "deep-dive-building-partner-portals-to-public-dashboards-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Partner Portals & Public Dashboards on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 27, "id": "quiver-contour-notepad", "name": "Quiver, Contour, Notepad", "layer": "applications", "tagline": "Foundry's analytics application trio.", "description": "Quiver, Contour, and Notepad round out Foundry's built-in analytics surface alongside Workshop-based apps.", "marks": ["Purpose-built analytics apps, distinct from Workshop"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "quiver / contour / notepad -overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Quiver, Contour, Notepad on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 28, "id": "vulcan", "name": "Vulcan", "layer": "applications", "tagline": "3D CAD/engineering-geometry viewer wired directly into the Ontology.", "description": "A standalone (and Workshop-embeddable) 3D visualization application that renders mesh models, 2D engineering drawings, and point clouds straight from Ontology data with no conversion step. Annotations, measurements, and section planes are written back to the Ontology as objects, so they can drive alerts, dashboards, or cross-team sharing.", "marks": ["Reads GLB/GLTF/STL/OBJ/PLY/3MF, DXF, LAS/LAZ natively", "Annotations/measurements persist as Ontology objects", "Bidirectional Workshop widget (camera, part selection, measurements)"], "status": "Beta, Sept 7, 2026", "rarity": "Uncommon", "firstObserved": "releases/2026-09.md", "sources": [{"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Spend 30 minutes building something small with Vulcan on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 29, "id": "sql-query-variables-workshop", "name": "SQL Query Variables (Workshop)", "layer": "applications", "tagline": "Define a Workshop variable with an Ontology SQL query instead of a function.", "description": "A Workshop variable-definition type that computes its value by running an Ontology SQL query directly inside the module — object-set/interface-set variables are exposed as SQL tables, other variables bind as query parameters, and AIP can draft the query from a natural-language description. Returns single values, arrays, or structs, recomputing automatically as bound inputs change.", "marks": ["No separate function to build/deploy", "Window functions (RANK/LAG/LEAD) in one statement", "AIP-drafted SQL from a text prompt", "Scoped to one module — use SQL Functions to share logic across apps"], "status": "GA, Aug 25, 2026", "rarity": "Common", "firstObserved": "releases/2026-08.md", "sources": [{"label": "releases", "ref": "2026-08.md"}], "buildSuggestion": "Spend 30 minutes building something small with SQL Query Variables (Workshop) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 30, "id": "model-studio", "name": "Model Studio", "layer": "applications", "tagline": "No-code workspace for training and deploying ML models.", "description": "A dedicated no-code application for training and deploying machine learning models directly in Foundry — point-and-click configuration for forecasting, classification, and regression trainers, with built-in experiment tracking, data lineage, and access controls. Entered beta the week of October 13, 2025 and reached General Availability the week of February 9, 2026.", "marks": ["Point-and-click model trainers (forecasting/classification/regression)", "No coding required", "Integrated experiment tracking", "Full data lineage & access controls built on the platform"], "status": "GA, Feb 2026", "rarity": "Common", "firstObserved": "releases/2025-10.md (beta)", "sources": [{"label": "releases", "ref": "2025-10.md"}, {"label": "releases", "ref": "2026-02.md"}], "buildSuggestion": "Pick one dataset you already have with an obvious label column (e.g. churned yes/no) and run it through Model Studio's classification trainer end-to-end with the defaults - the goal is to see the whole no-code training/experiment-tracking loop once, not to tune for accuracy.", "fieldNote": null}, {"n": 31, "id": "custom-widgets", "name": "Custom Widgets", "layer": "applications", "tagline": "Write real frontend code, securely rendered inside a Workshop module.", "description": "Lets technical builders extend Workshop past its built-in widget library by writing custom frontend code (e.g. React) that renders securely, isolated from the main Foundry page, with a dedicated developer mode, CLI tooling, and search indexing for reuse across applications. Announced in beta August 21, 2025; by November 2025 widget sets could be packaged automatically into Marketplace products.", "marks": ["Isolated/secure rendering — no OAuth or subdomain setup needed (unlike iframe widgets)", "Dedicated developer mode + CLI", "Indexed for discovery/reuse across Workshop apps", "Packages into Marketplace as widget sets"], "status": "Beta, Aug 2025 (Marketplace packaging added Nov 2025)", "rarity": "Uncommon", "firstObserved": "releases/2025-08.md", "sources": [{"label": "releases", "ref": "2025-08.md"}, {"label": "releases", "ref": "2025-11.md"}], "buildSuggestion": "Build the simplest possible custom widget (a static 'hello world' component) and drop it into one Workshop module in developer mode - the goal is just to see your own code render inside Workshop's sandbox, not to build anything useful yet.", "fieldNote": null}, {"n": 32, "id": "ai-fde", "name": "AI FDE", "layer": "aip", "tagline": "An agent that operates Foundry via natural language — reached GA March 12, 2026.", "description": "Translates natural-language requests into real Foundry operations: data transforms, ontology edits, Logic functions, Workshop apps, Automate automations. DevCon 5's flagship demo showed it decomposing a problem, writing AIP Logic + eval suites, iterating from 10% to 90% pass rate, then fixing itself from ontology-codified production feedback.", "marks": ["GA March 12, 2026", "Exploration vs Logic-creation modes", "Eval-driven self-repair", "Builds Workshop apps & Automate rules"], "status": "GA, March 12, 2026", "rarity": "Common", "firstObserved": "DevCon 5 + AI FDE overview docs", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}, {"label": "docs", "ref": "ai-fde/overview"}], "buildSuggestion": "Spend 30 minutes building something small with AI FDE on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 33, "id": "ai-fde-skills", "name": "AI FDE Skills", "layer": "aip", "tagline": "Composable, reusable capabilities for AI FDE sessions.", "description": "A Skills system for AI FDE surfaced enough that a community thread on 'tips for AI FDE Skills.md' has real engagement — practitioners are actively figuring out best practices.", "marks": ["Community-driven best-practice discovery", "See also the community AI FDE library"], "status": "Available, patterns still emerging", "rarity": "Common", "firstObserved": "community/6921", "sources": [{"label": "community", "ref": "6921-tips-for-ai-fde-skills-md.md"}], "buildSuggestion": "Spend 30 minutes building something small with AI FDE Skills on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 34, "id": "eval-driven-dev-loop", "name": "Eval-Driven Development Loop", "layer": "aip", "tagline": "AIP Evals baked directly into AI FDE's workflow.", "description": "AI FDE writes a failing eval test case from a requirement, runs the suite, reads failures, edits the Logic function, re-runs — iterating until it passes. Test cases can source from Manual entry, an Object set, or live Production runs.", "marks": ["10%→90% pass rate in one iteration (DevCon 5 demo)", "Production-run-sourced test cases"], "status": "Shown at DevCon 5 (live demo)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}, {"label": "docs", "ref": "aip-evals-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Eval-Driven Development Loop on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 35, "id": "ontology-feedback-loop", "name": "Ontology-Codified Feedback Loop", "layer": "aip", "tagline": "Production rejections become ontology objects an agent can act on.", "description": "When a user rejects an AI recommendation in Workshop, the free-text 'what went wrong' is stored as a linked Ontology feedback object. AI FDE can then query that feedback set, investigate, and patch the failing logic — shown taking a suite from 12/13 to 13/13.", "marks": ["Feedback = first-class Ontology object", "Closes the loop without a human re-writing the prompt"], "status": "Shown at DevCon 5 (live demo)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Ontology-Codified Feedback Loop on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 36, "id": "feedback-quality-gate", "name": "Feedback Quality-Gate Agent", "layer": "aip", "tagline": "'Agents building agents' — a second agent that improves the first agent's feedback.", "description": "Because raw production feedback is often just 'this is bad,' AI FDE built a second agent (via the same eval-driven loop) that intercepts low-quality feedback and asks a clarifying question before it's accepted.", "marks": ["Agent-built-by-agent", "Improves signal quality at the source"], "status": "Shown at DevCon 5 (live demo)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Feedback Quality-Gate Agent on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 37, "id": "smart-context-mgmt", "name": "Smart Context Management", "layer": "aip", "tagline": "Keeping AI FDE sessions coherent as task scope grows.", "description": "A `manage_context` capability that can hide stale context items mid-session, labeled 'Increased Autonomy' on the DevCon 5 capability grid.", "marks": ["manage_context tool", "Targets long-running session coherence"], "status": "Shown at DevCon 5", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Smart Context Management on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 38, "id": "automatic-mode-switching", "name": "Automatic Mode Switching", "layer": "aip", "tagline": "AI FDE changes its own operating mode mid-task.", "description": "AI FDE calls its own `change_mode` tool to move between Exploration (research, search-enabled) and Logic-creation modes without being told to, letting it access the full breadth of the platform for one task.", "marks": ["change_mode tool", "Labeled 'Increased Autonomy'"], "status": "Shown at DevCon 5", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Automatic Mode Switching on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 39, "id": "solution-design-tools", "name": "Solution Design Tools", "layer": "aip", "tagline": "AI FDE drafts an architecture diagram, then uses it as its own task list — but the canvas itself predates AI FDE.", "description": "`create_solution_design_diagram` produces a layered Data/Ontology/Application diagram for an end-to-end workflow; AI FDE then works through that plan as a checklist to build each piece. The underlying canvas is also a standalone, manually-usable Foundry application ('Solution Designer'): a Palantir Startup Fellowship team (Victus Technologies) was already using it by DevCon 4 to hand-document an architecture with a CONCEPT/COMPONENT/RESOURCE toolkit that tags real Foundry resource types (Compute Modules, Workshop, Actions, Datasets, Link Types, Egress Policies, Models).", "marks": ["Manually-usable app predates AI FDE automation (seen at DevCon 4)", "CONCEPT/COMPONENT/RESOURCE canvas tags real resource types", "AI-FDE-automated version (create_solution_design_diagram) doubles as an execution plan (DevCon 5)"], "status": "Shown at DevCon 5 (AI-FDE-automated); manual tool seen one DevCon earlier", "rarity": "Rare", "firstObserved": "DevCon 4 (Victus Technologies talk, manual use)", "sources": [{"label": "devcon4", "ref": "startup-fellowship-victus-technologies-devcon-4"}, {"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Solution Design Tools on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 40, "id": "aip-logic", "name": "AIP Logic", "layer": "aip", "tagline": "No-code LLM function builder.", "description": "Block- or graph-based editor for building LLM-backed functions: system prompts, tool calls, semantic search blocks, structured (struct) output, validators.", "marks": ["Block and Graph editing modes", "Struct output with validators", "Semantic search block type"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "logic-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with AIP Logic on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 41, "id": "aip-assist", "name": "AIP Assist", "layer": "aip", "tagline": "Platform-wide documentation copilot, RAG-based.", "description": "A chatbot available across Foundry that answers platform/doc questions via retrieval-augmented generation, and can be pointed at custom content sources (e.g. a Markdown docs repo) for org-specific answers.", "marks": ["RAG over official + custom docs", "Deployable as source-backed chatbots"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "aip overview / assist"}], "buildSuggestion": "Spend 30 minutes building something small with AIP Assist on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 42, "id": "aip-document-intelligence", "name": "AIP Document Intelligence", "layer": "aip", "tagline": "Low-code document extraction — OCR to VLM — deployed straight to a Python transform.", "description": "An application for configuring and deploying document-extraction workflows: upload sample PDFs/images, compare extraction strategies (raw text, OCR, layout-aware OCR, vision-language models) side by side on quality/speed/cost, then deploy the chosen strategy as a production Python transform (batch) or a per-page Python function that converts documents into structured Markdown with tables preserved. Entered beta October 8, 2025, reached GA February 4, 2026, with GA per-page Python-function deployment added July 28, 2026.", "marks": ["Side-by-side extraction-strategy comparison (quality/speed/cost)", "One-click deploy to a Python transform or a per-page Python function", "Preserves tables/formatting as Markdown", "Optional chunking + embeddings for RAG"], "status": "GA, Feb 4, 2026 (Python-function deploy GA July 2026)", "rarity": "Common", "firstObserved": "releases/2025-10.md (beta)", "sources": [{"label": "releases", "ref": "2025-10.md"}, {"label": "releases", "ref": "2026-02.md"}, {"label": "releases", "ref": "2026-07.md"}], "buildSuggestion": "Take one messy real PDF (a scanned invoice or a report with tables) and run it through two different extraction strategies side by side - compare the Markdown output quality before deciding which one to deploy.", "fieldNote": null}, {"n": 43, "id": "aip-chatbot-agent-studio", "name": "AIP Chatbot Studio / Agent Studio", "layer": "aip", "tagline": "No-code chatbot and agent building, deployable via OSDK.", "description": "Build and deploy chatbots/agents without code, internally on the platform or externally through OSDK-based apps.", "marks": ["No-code build", "Internal + external (OSDK) deployment"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "chatbot-studio-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with AIP Chatbot Studio / Agent Studio on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 44, "id": "foundry-pro-code-agents", "name": "Pro-code Agents (Foundry Agent Templates)", "layer": "aip", "tagline": "Ship a Claude Agent SDK / OpenAI Agents SDK / Google ADK agent bound to your Ontology, no manual auth wiring.", "description": "Templated pro-code agent repositories for the Claude Agent SDK, OpenAI Agents SDK, and Google Agent Development Kit, pre-wired with scoped OSDK, Ontology MCP, and Palantir MCP authentication so builders skip manual client-ID/secret setup. Every published agent gets an Ontology binding and an API name, making it directly callable from Workshop or OSDK with no extra configuration. An earlier version of the underlying 'publish an agent as a callable, versioned Function' pattern was previewed in the DevCon 5 hype reel. Reached General Availability July 9, 2026.", "marks": ["Templates for Claude Agent SDK, OpenAI Agents SDK, Google ADK", "Scoped OSDK/OMCP/Palantir MCP auth out of the box, no client secrets", "Publish = Ontology binding + callable API name", "Buildable via the Continue extension directly in the editor"], "status": "GA, July 9, 2026", "rarity": "Common", "firstObserved": "DevCon 5 (hype reel preview of publish_as_function)", "sources": [{"label": "devcon5", "ref": "hype-reel-devcon-5"}, {"label": "releases", "ref": "2026-07.md"}], "buildSuggestion": "Create one agent from the Claude Agent SDK template, publish it, and call it from a single Workshop button - the point is feeling how little auth plumbing is left once OSDK/OMCP scoping is automatic.", "fieldNote": null}, {"n": 45, "id": "aip-analyst", "name": "AIP Analyst", "layer": "aip", "tagline": "Conversational interface for exploring Ontology data.", "description": "A conversational AI surface purpose-built for exploring Ontology object data without writing queries by hand. Reached GA the week of April 13, 2026.", "marks": ["Ontology-native conversational exploration"], "status": "GA, April 13, 2026", "rarity": "Common", "firstObserved": "releases/2026-03.md, 2026-04.md", "sources": [{"label": "releases", "ref": "2026-03.md / 2026-04.md"}], "buildSuggestion": "Ask it one real question against an object type you actually maintain, then open its provenance graph and check every step actually traces back to real data before trusting the answer.", "fieldNote": "It's only as trustworthy as your Ontology Manager housekeeping - its own search scope is limited by object-type status/visibility/group, so a messy ontology means messy grounding, not a model problem."}, {"n": 46, "id": "aip-evolve", "name": "AIP Evolve", "layer": "aip", "tagline": "Autonomous cost/efficiency tuning for agents in production — reached GA September 8, 2026.", "description": "Coordinates fleets of AI FDE agents to improve AI systems in AIP: define a target, optimization goal, validation strategy, and constraints, then review the resulting proposal — validation results, output comparisons, confidence assessment — in Global Branching before merging. Early adopters have used it to cut AI costs, improve eval performance, and migrate workloads to open-source models.", "marks": ["Beta Aug 18, 2026 → GA Sept 8, 2026", "Guided goals: cost, latency, eval score, model migration", "Interactive agent graph + Global Branching review"], "status": "GA, Sept 8, 2026", "rarity": "Common", "firstObserved": "releases/2026-08.md (beta), releases/2026-09.md (GA)", "sources": [{"label": "releases", "ref": "2026-08.md"}, {"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Spend 30 minutes building something small with AIP Evolve on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 47, "id": "ontology-mcp", "name": "Ontology MCP (OMCP) + AIP Agents", "layer": "aip", "tagline": "Ontology exposed to external AI IDEs and agents over MCP.", "description": "Exposes a Developer Console application's Ontology resources (objects, actions, queries) as MCP tools that any compatible agent framework can discover and use — pro-code (LangChain, CrewAI, custom Python/TypeScript) or low-code (Copilot Studio and others) — with the application owner controlling exactly which resources are exposed. Distinct from AIP Agents, which build agents natively inside the platform. First previewed at DevCon 4 paired with the AIP Agents launch; entered beta for all Developer Console users by the end of January 2026.", "marks": ["Framework-agnostic (LangChain, CrewAI, Copilot Studio, custom code)", "Owner controls exactly which objects/actions/queries are exposed", "Configured per Developer Console application, not platform-wide", "Complements, doesn't replace, AIP Agents' native in-platform building"], "status": "Beta, Jan 2026", "rarity": "Uncommon", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "product-launch-aip-agents-and-ontology-mcp-devcon-4"}, {"label": "releases", "ref": "2026-01.md"}], "buildSuggestion": "Enable Ontology MCP on one Developer Console app with a single object type exposed, then connect it to a bare-bones local agent framework you already have running and ask it one question that requires an Ontology query - confirm the round trip works before exposing anything wider.", "fieldNote": null}, {"n": 48, "id": "mindkit", "name": "Mindkit (\"AI Hivemind\")", "layer": "aip", "tagline": "Dynamically spun-up agent swarms that plan, critique, and hand off to real execution.", "description": "Branded 'AI Hivemind' on stage: a capability built entirely from existing primitives (AIP Logic functions triggered by AIP Automate conditions, Ontology, Workshop, Marketplace) that dynamically mints a swarm of purpose-built agents for a complex problem, runs them through a Generate Agents -> Critique Ideas -> Annealment (iterative refinement, with human feedback stored as compounding knowledge) -> Execute Plan loop, and writes every step back as an inspectable Ontology object. Approved plans hand off to AI FDE, Maverick, or Workshop for real execution. Presented as in-development building blocks, explicitly 'not finished' — no GA date given.", "marks": ["4-stage loop: Generate Agents -> Critique -> Annealment -> Execute Plan", "Every agent output is a queryable Ontology object, not throwaway chat", "Human feedback compounds into a reusable knowledge base across future runs", "Assembled from AIP Logic + AIP Automate + Marketplace — no new engine"], "status": "Shown at DevCon 5 (in development, 'definitely not finished', no GA date)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-mindkit-devcon-5"}], "buildSuggestion": "Pick one real recurring decision at your org (e.g. 'which vendor proposal to pick') and hand-write just the Critique stage - three or four named critic personas and what each would flag - before automating any of it. That's the part of Hivemind's pattern you can copy without building the full swarm.", "fieldNote": null}, {"n": 49, "id": "live-audio-voice-agents", "name": "Live Audio / Real-Time Voice Agents", "layer": "aip", "tagline": "Voice-driven agents that read and write the Ontology, with a 5-layer security model for PHI/PII.", "description": "A real-time voice interface layered on the Ontology: an in-app spoken request can generate Ontology Scenarios (e.g. scheduling options), and outbound calls can be placed to affected parties for identity-verified, HIPAA-aware confirmations. Palantir paired the launch with a five-layer security architecture — network isolation via dedicated subdomains, InfoSec-gated data release, geo-locked regional model hubs (EU/US) for data residency, and customer-defined deterministic auth gates.", "marks": ["Outbound + inbound real-time voice", "Geo-locked model hubs (EU/US) via AIP Model Service", "Refuses third-party data disclosure (HIPAA-style) autonomously"], "status": "Shown at DevCon 5 (actively in development, no GA date)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ontology-foundations-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Live Audio / Real-Time Voice Agents on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 50, "id": "automate", "name": "Automate", "layer": "automation", "tagline": "Event- and schedule-triggered actions.", "description": "Foundry's automation engine: triggers on time, object changes, metric thresholds, or automation dependencies. AI FDE can now author Automate automations directly from a natural-language prompt.", "marks": ["Time / object-change / threshold / dependency triggers", "Now AI-FDE-authorable"], "status": "GA (AI-FDE authoring shown at DevCon 5)", "rarity": "Common", "firstObserved": "Documented baseline + DevCon 5", "sources": [{"label": "docs", "ref": "automate-overview.md"}, {"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Automate on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 51, "id": "foundry-rules", "name": "Foundry Rules", "layer": "automation", "tagline": "Bring domain expertise into real-time alerting.", "description": "Lets subject-matter experts encode rules for real-time alerting without writing pipeline code — announced as 'Foundry Rules & Real-Time Alerting.'", "marks": ["Expert-authored rules, not just engineer-authored"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "foundry-rules-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Foundry Rules on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 52, "id": "process-orchestration", "name": "Process Orchestration", "layer": "automation", "tagline": "Coordinating multi-system operational processes — shown in production at Eaton.", "description": "DevCon 4 'Code in Production' case study with Eaton on orchestrating real operational processes across systems using Foundry.", "marks": ["Real production deployment (Eaton)", "Cross-system coordination"], "status": "Shown at DevCon 4 (in production)", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "code-in-production-process-orchestration-x-eaton-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Process Orchestration on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 53, "id": "orchestrator", "name": "Orchestrator", "layer": "automation", "tagline": "A durable, interruptible execution runtime for automations that can run for months.", "description": "First announced as 'a new product' from the keynote stage at DevCon 4 (Nov 2025), then demoed in depth at DevCon 5: an execution runtime for Foundry Functions/AIP Logic that supports long-running, durable (checkpointed), and interruptible executions — an automation can pause for days awaiting human or external input via an `Await object condition` block, then resume exactly where it left off. Demoed orchestrating a medical prior-authorization workflow end-to-end, including pausing for a human document upload and for a payer's email reply.", "marks": ["Announced at DevCon 4, detailed at DevCon 5 — not a DevCon-5-only product", "Await object condition block replaces hand-rolled state machines/queues", "Executions can span hours to months", "Failure resumes mid-process, not from scratch"], "status": "Shown at DevCon 5 (available in build sessions, no GA date)", "rarity": "Rare", "firstObserved": "DevCon 4 (recap; announced from keynote stage)", "sources": [{"label": "devcon4", "ref": "devcon-4-recap"}, {"label": "devcon5", "ref": "product-launch-enterprise-automation-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Orchestrator on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 54, "id": "palantir-mcp", "name": "Palantir MCP", "layer": "devtools", "tagline": "70+ tools exposing Foundry to external AI IDEs.", "description": "An MCP server giving external AI coding tools and IDEs direct, local access to build/modify Foundry applications — datasets, ontology, code repos, Python transforms, OSDK a   }
  function step(delta){
    var i = visibleOrder.indexOf(currentId);
    if(i < 0) return;
    var j = i + delta;
    if(j >= 0 && j < visibleOrder.length) openViewer(visibleOrder[j]);
  }
  document.getElementById('closeBtn').addEventListener('click', function(){ viewer.close(); });
  document.getElementById('prevBtn').addEventListener('click', function(){ step(-1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ step(1); });
  viewer.addEventListener('click', function(e){ if(e.target === viewer) viewer.close(); });
  viewer.addEventListener('keydown', function(e){
    if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight') step(1);
    else if(e.key === 'ArrowLeft') step(-1);
  });
  viewer.addEventListener('close', function(){
    currentId = null;
    if(history.replaceState) history.replaceState(null, '', location.pathname + location.search);
  });

  document.getElementById('randomBtn').addEventListener('click', function(){
    var pool = features.filter(function(f){ return !collected[f.id]; });
    if(!pool.length) pool = features;
    openViewer(pool[Math.floor(Math.random() * pool.length)].id);
  });

  document.addEventListener('click', function(e){
    var copyBtn = e.target.closest('[data-copy]');
    if(copyBtn){ copyPrompt(copyBtn); return; }
    var card = e.target.closest('.tcg[data-id]');
    if(card && !card.closest('#viewerCard')) openViewer(card.getAttribute('data-id'));
  });

  document.getElementById('genDate').textContent = DATA.generated;
  renderHero();
  renderProgress();
  renderFresh();
  renderBinder();

  var hash = location.hash.replace('#', '');
  if(hash && byId(hash)) openViewer(hash, true);
})();
</script>
</body>
</html>
