low-builder", "name": "Workflow Builder", "layer": "applications", "tagline": "Building structured, multi-step operational workflows.", "description": "DevCon 4 product launch for a builder aimed at structured, multi-step workflows rather than single-screen apps.", "marks": ["Multi-step, not single-screen", "Product-launch talk"], "status": "Shown at DevCon 4 (product launch)", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "product-launch-workflow-builder-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Workflow Builder on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 26, "id": "provider-api-proxy", "name": "Provider API Proxy", "layer": "applications", "tagline": "Proxying external provider APIs through Foundry's governance layer.", "description": "DevCon 4 product launch — lets external API calls (e.g. to model providers or partner systems) route through Foundry with its governance, auth, and observability intact.", "marks": ["External API calls under Foundry governance"], "status": "Shown at DevCon 4 (product launch)", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "product-launch-provider-api-proxy-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Provider API Proxy on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 27, "id": "partner-portals", "name": "Partner Portals & Public Dashboards", "layer": "applications", "tagline": "Extending Foundry apps to external, non-Foundry-licensed users.", "description": "DevCon 4 deep-dive on patterns for building portals and dashboards for external partners/the public who don't have Foundry seats.", "marks": ["External/public audience, not internal users"], "status": "Shown at DevCon 4", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "deep-dive-building-partner-portals-to-public-dashboards-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Partner Portals & Public Dashboards on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 28, "id": "quiver-contour-notepad", "name": "Quiver, Contour, Notepad", "layer": "applications", "tagline": "Foundry's analytics application trio.", "description": "Quiver, Contour, and Notepad round out Foundry's built-in analytics surface alongside Workshop-based apps.", "marks": ["Purpose-built analytics apps, distinct from Workshop"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "quiver / contour / notepad -overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Quiver, Contour, Notepad on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 29, "id": "vulcan", "name": "Vulcan", "layer": "applications", "tagline": "3D CAD/engineering-geometry viewer wired directly into the Ontology.", "description": "A standalone (and Workshop-embeddable) 3D visualization application that renders mesh models, 2D engineering drawings, and point clouds straight from Ontology data with no conversion step. Annotations, measurements, and section planes are written back to the Ontology as objects, so they can drive alerts, dashboards, or cross-team sharing.", "marks": ["Reads GLB/GLTF/STL/OBJ/PLY/3MF, DXF, LAS/LAZ natively", "Annotations/measurements persist as Ontology objects", "Bidirectional Workshop widget (camera, part selection, measurements)"], "status": "Beta, Sept 7, 2026", "rarity": "Uncommon", "firstObserved": "releases/2026-09.md", "sources": [{"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Spend 30 minutes building something small with Vulcan on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 30, "id": "sql-query-variables-workshop", "name": "SQL Query Variables (Workshop)", "layer": "applications", "tagline": "Define a Workshop variable with an Ontology SQL query instead of a function.", "description": "A Workshop variable-definition type that computes its value by running an Ontology SQL query directly inside the module — object-set/interface-set variables are exposed as SQL tables, other variables bind as query parameters, and AIP can draft the query from a natural-language description. Returns single values, arrays, or structs, recomputing automatically as bound inputs change.", "marks": ["No separate function to build/deploy", "Window functions (RANK/LAG/LEAD) in one statement", "AIP-drafted SQL from a text prompt", "Scoped to one module — use SQL Functions to share logic across apps"], "status": "GA, Aug 25, 2026", "rarity": "Common", "firstObserved": "releases/2026-08.md", "sources": [{"label": "releases", "ref": "2026-08.md"}], "buildSuggestion": "Spend 30 minutes building something small with SQL Query Variables (Workshop) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 31, "id": "model-studio", "name": "Model Studio", "layer": "applications", "tagline": "No-code workspace for training and deploying ML models.", "description": "A dedicated no-code application for training and deploying machine learning models directly in Foundry — point-and-click configuration for forecasting, classification, and regression trainers, with built-in experiment tracking, data lineage, and access controls. Entered beta the week of October 13, 2025 and reached General Availability the week of February 9, 2026.", "marks": ["Point-and-click model trainers (forecasting/classification/regression)", "No coding required", "Integrated experiment tracking", "Full data lineage & access controls built on the platform"], "status": "GA, Feb 2026", "rarity": "Common", "firstObserved": "releases/2025-10.md (beta)", "sources": [{"label": "releases", "ref": "2025-10.md"}, {"label": "releases", "ref": "2026-02.md"}], "buildSuggestion": "Pick one dataset you already have with an obvious label column (e.g. churned yes/no) and run it through Model Studio's classification trainer end-to-end with the defaults - the goal is to see the whole no-code training/experiment-tracking loop once, not to tune for accuracy.", "fieldNote": null}, {"n": 32, "id": "custom-widgets", "name": "Custom Widgets", "layer": "applications", "tagline": "Write real frontend code, securely rendered inside a Workshop module.", "description": "Lets technical builders extend Workshop past its built-in widget library by writing custom frontend code (e.g. React) that renders securely, isolated from the main Foundry page, with a dedicated developer mode, CLI tooling, and search indexing for reuse across applications. Announced in beta August 21, 2025; by November 2025 widget sets could be packaged automatically into Marketplace products.", "marks": ["Isolated/secure rendering — no OAuth or subdomain setup needed (unlike iframe widgets)", "Dedicated developer mode + CLI", "Indexed for discovery/reuse across Workshop apps", "Packages into Marketplace as widget sets"], "status": "Beta, Aug 2025 (Marketplace packaging added Nov 2025)", "rarity": "Uncommon", "firstObserved": "releases/2025-08.md", "sources": [{"label": "releases", "ref": "2025-08.md"}, {"label": "releases", "ref": "2025-11.md"}], "buildSuggestion": "Build the simplest possible custom widget (a static 'hello world' component) and drop it into one Workshop module in developer mode - the goal is just to see your own code render inside Workshop's sandbox, not to build anything useful yet.", "fieldNote": null}, {"n": 33, "id": "ai-fde", "name": "AI FDE", "layer": "aip", "tagline": "An agent that operates Foundry via natural language — reached GA March 12, 2026.", "description": "Translates natural-language requests into real Foundry operations: data transforms, ontology edits, Logic functions, Workshop apps, Automate automations. DevCon 5's flagship demo showed it decomposing a problem, writing AIP Logic + eval suites, iterating from 10% to 90% pass rate, then fixing itself from ontology-codified production feedback.", "marks": ["GA March 12, 2026", "Exploration vs Logic-creation modes", "Eval-driven self-repair", "Builds Workshop apps & Automate rules"], "status": "GA, March 12, 2026", "rarity": "Common", "firstObserved": "DevCon 5 + AI FDE overview docs", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}, {"label": "docs", "ref": "ai-fde/overview"}], "buildSuggestion": "Spend 30 minutes building something small with AI FDE on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 34, "id": "ai-fde-skills", "name": "AI FDE Skills", "layer": "aip", "tagline": "Composable, reusable capabilities for AI FDE sessions.", "description": "A Skills system for AI FDE surfaced enough that a community thread on 'tips for AI FDE Skills.md' has real engagement — practitioners are actively figuring out best practices.", "marks": ["Community-driven best-practice discovery", "See also the community AI FDE library"], "status": "Available, patterns still emerging", "rarity": "Common", "firstObserved": "community/6921", "sources": [{"label": "community", "ref": "6921-tips-for-ai-fde-skills-md.md"}], "buildSuggestion": "Spend 30 minutes building something small with AI FDE Skills on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 35, "id": "eval-driven-dev-loop", "name": "Eval-Driven Development Loop", "layer": "aip", "tagline": "AIP Evals baked directly into AI FDE's workflow.", "description": "AI FDE writes a failing eval test case from a requirement, runs the suite, reads failures, edits the Logic function, re-runs — iterating until it passes. Test cases can source from Manual entry, an Object set, or live Production runs.", "marks": ["10%→90% pass rate in one iteration (DevCon 5 demo)", "Production-run-sourced test cases"], "status": "Shown at DevCon 5 (live demo)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}, {"label": "docs", "ref": "aip-evals-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Eval-Driven Development Loop on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 36, "id": "pipeline-builder-llm-eval-suites", "name": "Pipeline Builder LLM Evaluation Suites", "layer": "aip", "tagline": "Regression-test a 'Use LLM' node against known-good outputs before you ship the pipeline change.", "description": "Evaluation suites for Pipeline Builder's Use LLM nodes: import a Foundry dataset (or type in test cases), attach one or more evaluators, and run in an isolated environment that doesn't touch the production pipeline. Each run writes detailed results to a Foundry dataset, previewable in Pipeline Builder or analyzable in Contour. Generally available as of September 10, 2026.", "marks": ["Isolated from the production pipeline", "Evaluators: exact string match, LLM-as-a-judge with a user-defined condition", "Every run writes a results dataset you can trend over time"], "status": "GA, Sept 10, 2026", "rarity": "Common", "firstObserved": "releases/2026-09.md", "sources": [{"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Pick one existing Use LLM node (a classifier or extractor is ideal), assemble 10 test rows with the answer you expect, and add an exact-match evaluator plus one LLM-as-a-judge evaluator. Then change the prompt and re-run to see which of your 10 cases flip.", "fieldNote": null}, {"n": 37, "id": "ontology-feedback-loop", "name": "Ontology-Codified Feedback Loop", "layer": "aip", "tagline": "Production rejections become ontology objects an agent can act on.", "description": "When a user rejects an AI recommendation in Workshop, the free-text 'what went wrong' is stored as a linked Ontology feedback object. AI FDE can then query that feedback set, investigate, and patch the failing logic — shown taking a suite from 12/13 to 13/13.", "marks": ["Feedback = first-class Ontology object", "Closes the loop without a human re-writing the prompt"], "status": "Shown at DevCon 5 (live demo)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Ontology-Codified Feedback Loop on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 38, "id": "feedback-quality-gate", "name": "Feedback Quality-Gate Agent", "layer": "aip", "tagline": "'Agents building agents' — a second agent that improves the first agent's feedback.", "description": "Because raw production feedback is often just 'this is bad,' AI FDE built a second agent (via the same eval-driven loop) that intercepts low-quality feedback and asks a clarifying question before it's accepted.", "marks": ["Agent-built-by-agent", "Improves signal quality at the source"], "status": "Shown at DevCon 5 (live demo)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Feedback Quality-Gate Agent on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 39, "id": "smart-context-mgmt", "name": "Smart Context Management", "layer": "aip", "tagline": "Keeping AI FDE sessions coherent as task scope grows.", "description": "A `manage_context` capability that can hide stale context items mid-session, labeled 'Increased Autonomy' on the DevCon 5 capability grid.", "marks": ["manage_context tool", "Targets long-running session coherence"], "status": "Shown at DevCon 5", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Smart Context Management on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 40, "id": "automatic-mode-switching", "name": "Automatic Mode Switching", "layer": "aip", "tagline": "AI FDE changes its own operating mode mid-task.", "description": "AI FDE calls its own `change_mode` tool to move between Exploration (research, search-enabled) and Logic-creation modes without being told to, letting it access the full breadth of the platform for one task.", "marks": ["change_mode tool", "Labeled 'Increased Autonomy'"], "status": "Shown at DevCon 5", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Automatic Mode Switching on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 41, "id": "solution-design-tools", "name": "Solution Design Tools", "layer": "aip", "tagline": "AI FDE drafts an architecture diagram, then uses it as its own task list — but the canvas itself predates AI FDE.", "description": "`create_solution_design_diagram` produces a layered Data/Ontology/Application diagram for an end-to-end workflow; AI FDE then works through that plan as a checklist to build each piece. The underlying canvas is also a standalone, manually-usable Foundry application ('Solution Designer'): a Palantir Startup Fellowship team (Victus Technologies) was already using it by DevCon 4 to hand-document an architecture with a CONCEPT/COMPONENT/RESOURCE toolkit that tags real Foundry resource types (Compute Modules, Workshop, Actions, Datasets, Link Types, Egress Policies, Models).", "marks": ["Manually-usable app predates AI FDE automation (seen at DevCon 4)", "CONCEPT/COMPONENT/RESOURCE canvas tags real resource types", "AI-FDE-automated version (create_solution_design_diagram) doubles as an execution plan (DevCon 5)"], "status": "Shown at DevCon 5 (AI-FDE-automated); manual tool seen one DevCon earlier", "rarity": "Rare", "firstObserved": "DevCon 4 (Victus Technologies talk, manual use)", "sources": [{"label": "devcon4", "ref": "startup-fellowship-victus-technologies-devcon-4"}, {"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Solution Design Tools on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 42, "id": "aip-logic", "name": "AIP Logic", "layer": "aip", "tagline": "No-code LLM function builder.", "description": "Block- or graph-based editor for building LLM-backed functions: system prompts, tool calls, semantic search blocks, structured (struct) output, validators.", "marks": ["Block and Graph editing modes", "Struct output with validators", "Semantic search block type"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "logic-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with AIP Logic on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 43, "id": "aip-assist", "name": "AIP Assist", "layer": "aip", "tagline": "Platform-wide documentation copilot, RAG-based.", "description": "A chatbot available across Foundry that answers platform/doc questions via retrieval-augmented generation, and can be pointed at custom content sources (e.g. a Markdown docs repo) for org-specific answers.", "marks": ["RAG over official + custom docs", "Deployable as source-backed chatbots"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "aip overview / assist"}], "buildSuggestion": "Spend 30 minutes building something small with AIP Assist on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 44, "id": "aip-document-intelligence", "name": "AIP Document Intelligence", "layer": "aip", "tagline": "Low-code document extraction — OCR to VLM — deployed straight to a Python transform.", "description": "An application for configuring and deploying document-extraction workflows: upload sample PDFs/images, compare extraction strategies (raw text, OCR, layout-aware OCR, vision-language models) side by side on quality/speed/cost, then deploy the chosen strategy as a production Python transform (batch) or a per-page Python function that converts documents into structured Markdown with tables preserved. Entered beta October 8, 2025, reached GA February 4, 2026, with GA per-page Python-function deployment added July 28, 2026.", "marks": ["Side-by-side extraction-strategy comparison (quality/speed/cost)", "One-click deploy to a Python transform or a per-page Python function", "Preserves tables/formatting as Markdown", "Optional chunking + embeddings for RAG"], "status": "GA, Feb 4, 2026 (Python-function deploy GA July 2026)", "rarity": "Common", "firstObserved": "releases/2025-10.md (beta)", "sources": [{"label": "releases", "ref": "2025-10.md"}, {"label": "releases", "ref": "2026-02.md"}, {"label": "releases", "ref": "2026-07.md"}], "buildSuggestion": "Take one messy real PDF (a scanned invoice or a report with tables) and run it through two different extraction strategies side by side - compare the Markdown output quality before deciding which one to deploy.", "fieldNote": null}, {"n": 45, "id": "aip-chatbot-agent-studio", "name": "AIP Chatbot Studio / Agent Studio", "layer": "aip", "tagline": "No-code chatbot and agent building, deployable via OSDK.", "description": "Build and deploy chatbots/agents without code, internally on the platform or externally through OSDK-based apps.", "marks": ["No-code build", "Internal + external (OSDK) deployment"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "chatbot-studio-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with AIP Chatbot Studio / Agent Studio on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 46, "id": "foundry-pro-code-agents", "name": "Pro-code Agents (Foundry Agent Templates)", "layer": "aip", "tagline": "Ship a Claude Agent SDK / OpenAI Agents SDK / Google ADK agent bound to your Ontology, no manual auth wiring.", "description": "Templated pro-code agent repositories for the Claude Agent SDK, OpenAI Agents SDK, and Google Agent Development Kit, pre-wired with scoped OSDK, Ontology MCP, and Palantir MCP authentication so builders skip manual client-ID/secret setup. Every published agent gets an Ontology binding and an API name, making it directly callable from Workshop or OSDK with no extra configuration. An earlier version of the underlying 'publish an agent as a callable, versioned Function' pattern was previewed in the DevCon 5 hype reel. Reached General Availability July 9, 2026.", "marks": ["Templates for Claude Agent SDK, OpenAI Agents SDK, Google ADK", "Scoped OSDK/OMCP/Palantir MCP auth out of the box, no client secrets", "Publish = Ontology binding + callable API name", "Buildable via the Continue extension directly in the editor"], "status": "GA, July 9, 2026", "rarity": "Common", "firstObserved": "DevCon 5 (hype reel preview of publish_as_function)", "sources": [{"label": "devcon5", "ref": "hype-reel-devcon-5"}, {"label": "releases", "ref": "2026-07.md"}], "buildSuggestion": "Create one agent from the Claude Agent SDK template, publish it, and call it from a single Workshop button - the point is feeling how little auth plumbing is left once OSDK/OMCP scoping is automatic.", "fieldNote": null}, {"n": 47, "id": "aip-analyst", "name": "AIP Analyst", "layer": "aip", "tagline": "Conversational interface for exploring Ontology data.", "description": "A conversational AI surface purpose-built for exploring Ontology object data without writing queries by hand. Reached GA the week of April 13, 2026.", "marks": ["Ontology-native conversational exploration"], "status": "GA, April 13, 2026", "rarity": "Common", "firstObserved": "releases/2026-03.md, 2026-04.md", "sources": [{"label": "releases", "ref": "2026-03.md / 2026-04.md"}], "buildSuggestion": "Ask it one real question against an object type you actually maintain, then open its provenance graph and check every step actually traces back to real data before trusting the answer.", "fieldNote": "It's only as trustworthy as your Ontology Manager housekeeping - its own search scope is limited by object-type status/visibility/group, so a messy ontology means messy grounding, not a model problem."}, {"n": 48, "id": "aip-evolve", "name": "AIP Evolve", "layer": "aip", "tagline": "Autonomous cost/efficiency tuning for agents in production — reached GA September 8, 2026.", "description": "Coordinates fleets of AI FDE agents to improve AI systems in AIP: define a target, optimization goal, validation strategy, and constraints, then review the resulting proposal — validation results, output comparisons, confidence assessment — in Global Branching before merging. Early adopters have used it to cut AI costs, improve eval performance, and migrate workloads to open-source models.", "marks": ["Beta Aug 18, 2026 → GA Sept 8, 2026", "Guided goals: cost, latency, eval score, model migration", "Interactive agent graph + Global Branching review"], "status": "GA, Sept 8, 2026", "rarity": "Common", "firstObserved": "releases/2026-08.md (beta), releases/2026-09.md (GA)", "sources": [{"label": "releases", "ref": "2026-08.md"}, {"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Spend 30 minutes building something small with AIP Evolve on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 49, "id": "ontology-mcp", "name": "Ontology MCP (OMCP) + AIP Agents", "layer": "aip", "tagline": "Ontology exposed to external AI IDEs and agents over MCP.", "description": "Exposes a Developer Console application's Ontology resources (objects, actions, queries) as MCP tools that any compatible agent framework can discover and use — pro-code (LangChain, CrewAI, custom Python/TypeScript) or low-code (Copilot Studio and others) — with the application owner controlling exactly which resources are exposed. Distinct from AIP Agents, which build agents natively inside the platform. First previewed at DevCon 4 paired with the AIP Agents launch; entered beta for all Developer Console users by the end of January 2026.", "marks": ["Framework-agnostic (LangChain, CrewAI, Copilot Studio, custom code)", "Owner controls exactly which objects/actions/queries are exposed", "Configured per Developer Console application, not platform-wide", "Complements, doesn't replace, AIP Agents' native in-platform building"], "status": "Beta, Jan 2026", "rarity": "Uncommon", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "product-launch-aip-agents-and-ontology-mcp-devcon-4"}, {"label": "releases", "ref": "2026-01.md"}], "buildSuggestion": "Enable Ontology MCP on one Developer Console app with a single object type exposed, then connect it to a bare-bones local agent framework you already have running and ask it one question that requires an Ontology query - confirm the round trip works before exposing anything wider.", "fieldNote": null}, {"n": 50, "id": "mindkit", "name": "Mindkit (\"AI Hivemind\")", "layer": "aip", "tagline": "Dynamically spun-up agent swarms that plan, critique, and hand off to real execution.", "description": "Branded 'AI Hivemind' on stage: a capability built entirely from existing primitives (AIP Logic functions triggered by AIP Automate conditions, Ontology, Workshop, Marketplace) that dynamically mints a swarm of purpose-built agents for a complex problem, runs them through a Generate Agents -> Critique Ideas -> Annealment (iterative refinement, with human feedback stored as compounding knowledge) -> Execute Plan loop, and writes every step back as an inspectable Ontology object. Approved plans hand off to AI FDE, Maverick, or Workshop for real execution. Presented as in-development building blocks, explicitly 'not finished' — no GA date given.", "marks": ["4-stage loop: Generate Agents -> Critique -> Annealment -> Execute Plan", "Every agent output is a queryable Ontology object, not throwaway chat", "Human feedback compounds into a reusable knowledge base across future runs", "Assembled from AIP Logic + AIP Automate + Marketplace — no new engine"], "status": "Shown at DevCon 5 (in development, 'definitely not finished', no GA date)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-mindkit-devcon-5"}], "buildSuggestion": "Pick one real recurring decision at your org (e.g. 'which vendor proposal to pick') and hand-write just the Critique stage - three or four named critic personas and what each would flag - before automating any of it. That's the part of Hivemind's pattern you can copy without building the full swarm.", "fieldNote": null}, {"n": 51, "id": "live-audio-voice-agents", "name": "Live Audio / Real-Time Voice Agents", "layer": "aip", "tagline": "Voice-driven agents that read and write the Ontology, with a 5-layer security model for PHI/PII.", "description": "A real-time voice interface layered on the Ontology: an in-app spoken request can generate Ontology Scenarios (e.g. scheduling options), and outbound calls can be placed to affected parties for identity-verified, HIPAA-aware confirmations. Palantir paired the launch with a five-layer security architecture — network isolation via dedicated subdomains, InfoSec-gated data release, geo-locked regional model hubs (EU/US) for data residency, and customer-defined deterministic auth gates.", "marks": ["Outbound + inbound real-time voice", "Geo-locked model hubs (EU/US) via AIP Model Service", "Refuses third-party data disclosure (HIPAA-style) autonomously"], "status": "Shown at DevCon 5 (actively in development, no GA date)", "rarity": "Rare", "firstObserved": "DevCon 5", "sources": [{"label": "devcon5", "ref": "product-launch-ontology-foundations-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Live Audio / Real-Time Voice Agents on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 52, "id": "automate", "name": "Automate", "layer": "automation", "tagline": "Event- and schedule-triggered actions.", "description": "Foundry's automation engine: triggers on time, object changes, metric thresholds, or automation dependencies. AI FDE can now author Automate automations directly from a natural-language prompt.", "marks": ["Time / object-change / threshold / dependency triggers", "Now AI-FDE-authorable"], "status": "GA (AI-FDE authoring shown at DevCon 5)", "rarity": "Common", "firstObserved": "Documented baseline + DevCon 5", "sources": [{"label": "docs", "ref": "automate-overview.md"}, {"label": "devcon5", "ref": "product-launch-ai-fde-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Automate on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 53, "id": "foundry-rules", "name": "Foundry Rules", "layer": "automation", "tagline": "Bring domain expertise into real-time alerting.", "description": "Lets subject-matter experts encode rules for real-time alerting without writing pipeline code — announced as 'Foundry Rules & Real-Time Alerting.'", "marks": ["Expert-authored rules, not just engineer-authored"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "foundry-rules-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Foundry Rules on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 54, "id": "process-orchestration", "name": "Process Orchestration", "layer": "automation", "tagline": "Coordinating multi-system operational processes — shown in production at Eaton.", "description": "DevCon 4 'Code in Production' case study with Eaton on orchestrating real operational processes across systems using Foundry.", "marks": ["Real production deployment (Eaton)", "Cross-system coordination"], "status": "Shown at DevCon 4 (in production)", "rarity": "Rare", "firstObserved": "DevCon 4", "sources": [{"label": "devcon4", "ref": "code-in-production-process-orchestration-x-eaton-devcon-4"}], "buildSuggestion": "Spend 30 minutes building something small with Process Orchestration on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 55, "id": "orchestrator", "name": "Orchestrator", "layer": "automation", "tagline": "A durable, interruptible execution runtime for automations that can run for months.", "description": "First announced as 'a new product' from the keynote stage at DevCon 4 (Nov 2025), then demoed in depth at DevCon 5: an execution runtime for Foundry Functions/AIP Logic that supports long-running, durable (checkpointed), and interruptible executions — an automation can pause for days awaiting human or external input via an `Await object condition` block, then resume exactly where it left off. Demoed orchestrating a medical prior-authorization workflow end-to-end, including pausing for a human document upload and for a payer's email reply.", "marks": ["Announced at DevCon 4, detailed at DevCon 5 — not a DevCon-5-only product", "Await object condition block replaces hand-rolled state machines/queues", "Executions can span hours to months", "Failure resumes mid-process, not from scratch"], "status": "Shown at DevCon 5 (available in build sessions, no GA date)", "rarity": "Rare", "firstObserved": "DevCon 4 (recap; announced from keynote stage)", "sources": [{"label": "devcon4", "ref": "devcon-4-recap"}, {"label": "devcon5", "ref": "product-launch-enterprise-automation-devcon-5"}], "buildSuggestion": "Spend 30 minutes building something small with Orchestrator on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 56, "id": "palantir-mcp", "name": "Palantir MCP", "layer": "devtools", "tagline": "70+ tools exposing Foundry to external AI IDEs.", "description": "An MCP server giving external AI coding tools and IDEs direct, local access to build/modify Foundry applications — datasets, ontology, code repos, Python transforms, OSDK apps, data connections — without leaving the editor. First reached GA across all enrollments in July 2025; October 2025 added Ontology SDK 'vibe coding' tools (view-osdk-definition, generate-sdk-version, Platform SDK code generation); grew to 70-80+ tools across 14 categories, on by default for all enrollments, by June 22, 2026.", "marks": ["Initial GA July 2025, not June 2026", "70-80+ tools across 14 categories by June 2026", "search_foundry_documentation tool", "Ontology SDK 'vibe coding' tools added Oct 2025"], "status": "GA, July 2025 (initial); expanded to 70+ tools, on by default all enrollments, June 22, 2026", "rarity": "Common", "firstObserved": "releases/2025-07.md", "sources": [{"label": "releases", "ref": "2025-07.md"}, {"label": "releases", "ref": "2025-10.md"}, {"label": "releases", "ref": "2026-06.md"}, {"label": "docs", "ref": "palantir-mcp/overview"}], "buildSuggestion": "Run list_foundry_namespaces and search_foundry_projects against your own enrollment first - read-only, safe, and confirms the connection is actually live before you trust it for anything that writes.", "fieldNote": "The org-level Control Panel toggle for this can silently revert even after you've enabled it once - if a call suddenly says \"Feature disabled,\" check Control Panel -> Code Repositories before assuming the config itself broke."}, {"n": 57, "id": "model-providers-in-aip", "name": "Expanded Model Providers in AIP", "layer": "devtools", "tagline": "Anthropic (via Azure) and Google Gemini (via Vertex) added to AIP.", "description": "June 2026: Anthropic Claude models served through Azure became available in AIP; Gemini family models became accessible from AIP applications in IL5 enrollments through Google Vertex. September 2026 broadened this: Claude Opus 5 via AWS Bedrock on IL2/IL4, GPT-5.6 Sol/Terra/Luna via Azure OpenAI on IL2/IL4/IL5, Gemini 3.8 Flash via Vertex (commercial, US/EU georestricted, IL2/IL4/IL5), and open-weight GLM-5.3, GLM-5.3 Flash, and Kimi K3 via Fireworks on non-georestricted enrollments.", "marks": ["Claude via Azure", "Gemini via Vertex (IL5)", "Sept 2026: Opus 5 (Bedrock), GPT-5.6 series, Gemini 3.8 Flash", "Sept 2026: open-weight GLM-5.3 / Kimi K3 via Fireworks"], "status": "GA, June 2026 (expanded Sept 2026)", "rarity": "Common", "firstObserved": "releases/2026-06.md", "sources": [{"label": "releases", "ref": "2026-06.md"}, {"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Open AIP's supported-models list for your enrollment and pick one existing AIP Logic function. Re-run the same test input against a frontier model and one of the cheaper or open-weight options, and compare answer quality against token cost - the trade-off AIP Evolve automates.", "fieldNote": null}, {"n": 58, "id": "fine-grained-tokens", "name": "Fine-Grained Personal Tokens", "layer": "devtools", "tagline": "Scoped API tokens instead of all-or-nothing access.", "description": "Community-requested and discussed: personal access tokens scoped to specific permissions rather than full account access.", "marks": ["Community thread: active feature discussion"], "status": "Community-tracked", "rarity": "Rare", "firstObserved": "community/6051", "sources": [{"label": "community", "ref": "6051-fine-grained-personal-tokens.md"}], "buildSuggestion": "Spend 30 minutes building something small with Fine-Grained Personal Tokens on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 59, "id": "superrepo-foundry-cli", "name": "SuperRepo & Foundry CLI", "layer": "devtools", "tagline": "A pro-code monorepo — Ontology-as-code, Functions, and a React app, deployed as one artifact.", "description": "A single monorepo holding Ontology definitions (in TypeScript), Functions, and a React front-end, developed locally against an embedded Ontology server and deployed as a signed Marketplace product via the Rust-based Foundry CLI (`foundry create` / `foundry deploy`). Previewed at DevCon 5 under the internal codename \"SuperRepo\"; reached public beta in August 2026.", "marks": ["Embedded local Ontology server — no Foundry connection needed to iterate", "Ontology-as-code with auto-regenerated OSDK on every save", "Compiles to a signed Marketplace product", "Python functions, Automate, and data pipelines not yet supported"], "status": "Beta, Aug 4, 2026", "rarity": "Uncommon", "firstObserved": "devcon5/product-launch-developer-experience-devcon-5 (preview); releases/2026-08.md (beta)", "sources": [{"label": "devcon5", "ref": "product-launch-developer-experience-devcon-5"}, {"label": "releases", "ref": "2026-08.md"}], "buildSuggestion": "Spend 30 minutes building something small with SuperRepo & Foundry CLI on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 60, "id": "devops-product-groups", "name": "Foundry DevOps Product Groups", "layer": "devtools", "tagline": "Validate that a set of Marketplace products installs together before you deploy them.", "description": "Product groups in Foundry DevOps model an offering made of several products that ship together, pulled from multiple stores alongside existing installations, and check compatibility before installation rather than during it. Catches missing inputs, duplicate outputs, dependency cycles, and incompatible linked product versions, and can freeze immutable snapshots of exact member versions plus validation results. Available across all enrollments as of September 15, 2026; early users report validation-and-install time dropping from weeks to hours.", "marks": ["Dependency graph across products from multiple stores", "Pre-deploy validation of missing inputs, duplicate outputs, cycles", "Track latest, a release channel, or a pinned version per product", "Immutable snapshots for comparing configurations over time"], "status": "GA, Sept 15, 2026", "rarity": "Common", "firstObserved": "releases/2026-09.md", "sources": [{"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Open one DevOps store that has two products you already know depend on each other, create a product group containing both, and run validation. Then deliberately pin one to an older version and see what blocker the validator reports.", "fieldNote": null}, {"n": 61, "id": "flow-capture", "name": "Flow Capture", "layer": "devtools", "tagline": "Record a Foundry workflow, get LLM-generated Markdown documentation.", "description": "An application for generating documentation from recorded Foundry workflows: capture screen recordings (automatic or manual screenshots) plus a narrated voice-over, then have an LLM turn that into structured Markdown using templates for general docs, feature requests, or bug reports. Exports to a Walkthrough, Notepad document, ZIP, or PDF. Entered beta the week of November 3, 2025.", "marks": ["Auto or manual screenshot capture per click", "Voice-over recording + transcription", "Choice of LLM model and custom prompts", "Exports to Walkthrough/Notepad/PDF/ZIP"], "status": "Beta, Nov 2025", "rarity": "Uncommon", "firstObserved": "releases/2025-10.md", "sources": [{"label": "releases", "ref": "2025-10.md"}], "buildSuggestion": "Record yourself doing one real 5-step task you'd normally have to explain to a new teammate, then let Flow Capture draft the doc from that recording and see how much editing it actually needs before you'd trust it.", "fieldNote": null}, {"n": 62, "id": "workflow-lineage", "name": "Workflow Lineage", "layer": "governance", "tagline": "End-to-end lineage across pipelines, ontology, and apps.", "description": "Traces data and decision lineage across the full workflow, not just within a single pipeline. A community AMA covered 'the story behind the rename' — this product has iterated on naming/scope.", "marks": ["Cross-boundary lineage (pipelines → ontology → apps)"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "workflow-lineage-overview.md"}, {"label": "community", "ref": "5575"}], "buildSuggestion": "Spend 30 minutes building something small with Workflow Lineage on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 63, "id": "aip-observability", "name": "Ontology & AIP Observability", "layer": "governance", "tagline": "Monitoring the AI layer itself, not just pipelines.", "description": "Purpose-built observability for Ontology and AIP usage/behavior — distinct from general pipeline observability.", "marks": ["AI-layer-specific monitoring"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "aip-observability-overview.md"}], "buildSuggestion": "Spend 30 minutes building something small with Ontology & AIP Observability on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 64, "id": "data-health", "name": "Data Health", "layer": "governance", "tagline": "Automated dataset health checks.", "description": "Automated checks on dataset quality/freshness/health, surfaced in Pipeline Builder and elsewhere.", "marks": ["Composable by agents (per DevCon 5 keynote framing)"], "status": "GA", "rarity": "Common", "firstObserved": "Documented baseline", "sources": [{"label": "docs", "ref": "observability-data-health.md"}], "buildSuggestion": "Spend 30 minutes building something small with Data Health on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 65, "id": "sensitive-data-scanner-llm-match", "name": "Sensitive Data Scanner: Language Model Match Conditions", "layer": "governance", "tagline": "Describe sensitive data in plain English and let an LLM find it - including in images.", "description": "A Sensitive Data Scanner match-condition type for data that's hard to express as a regex or fixed list: write a natural-language prompt, add examples and counter-examples, and an LLM classifies scanned content, column names, or both (with AND/OR logic). Works across datasets, virtual tables, and media sets; for media sets you can pick a vision-capable model to classify image content directly or a text-only model over extracted document text. Generally available across enrollments the week of September 7, 2026.", "marks": ["Prompt + examples/counter-examples instead of regex", "Scan content, column names, or either/both", "Covers datasets, virtual tables, and media sets", "Vision model option for images"], "status": "GA, Sept 7, 2026", "rarity": "Common", "firstObserved": "releases/2026-09.md", "sources": [{"label": "releases", "ref": "2026-09.md"}], "buildSuggestion": "Write one language-model match condition for something a regex can't catch (e.g. 'free-text notes that mention a person's medical condition'), give it two examples and two counter-examples, and run it against a small dataset you already know contains a few true positives. Check what it misses before trusting it.", "fieldNote": null}, {"n": 66, "id": "object-timeline-autopilot", "name": "Object Timeline (Autopilot Observability)", "layer": "governance", "tagline": "Per-object audit trail of every agent and human edit, with token/runtime cost attribution.", "description": "A timeline view showing every action taken on an Ontology object — by agents (Autopilot) or humans — with full attribution, token usage, runtime, and waiting time, so builders can see where an agentic workflow is spending time or money and trace any edit back to the execution that made it. Accessible from Autopilot's graph view or Object Explorer.", "marks": ["Token usage per step", "Agentic vs. human coverage split", "Traces any edit back to its execution"], "status": "GA, Aug 11, 2026", "rarity": "Common", "firstObserved": "releases/2026-08.md", "sources": [{"label": "releases", "ref": "2026-08.md"}], "buildSuggestion": "Spend 30 minutes building something small with Object Timeline (Autopilot Observability) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 67, "id": "saios-nemotron", "name": "Sovereign Nemotron Supply-Chain Stack (SAIOS)", "layer": "frontier", "tagline": "NVIDIA + Palantir: open models, post-trained on your data, run inside Foundry.", "description": "NVIDIA Nemotron open models post-trained on customer operational data, run inside Foundry + AIP, grounded by the Ontology, with NVIDIA cuOpt doing optimization. Deployed via the Palantir Sovereign AI Operating System Reference Architecture (on-prem via Cisco/Dell, or cloud/colo via Rackspace/Nebius). Announced 2026-09-10 at AIPCon 11; NVIDIA is customer zero, applying it across 1.3M parts in a Vera Rubin rack.", "marks": ["NOT YET IN OFFICIAL DOCS as of last refresh", "NVIDIA = customer zero", "On-prem or cloud/colo deployment"], "status": "Announced, Sept 10, 2026 (AIPCon 11)", "rarity": "Uncommon", "firstObserved": "company-context/2026-09-16.md", "sources": [{"label": "company-context", "ref": "2026-09-16.md — NVIDIA Newsroom"}], "buildSuggestion": "Spend 30 minutes building something small with Sovereign Nemotron Supply-Chain Stack (SAIOS) on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 68, "id": "cardinal-program", "name": "Cardinal Program / Ontology for Cybersecurity", "layer": "frontier", "tagline": "Free autonomous red-teaming for U.S. critical infrastructure.", "description": "With Method Security: free, opt-in, continuous autonomous red-teaming for U.S. municipalities/utilities/critical-infrastructure operators. A new 'Ontology for Cybersecurity' maps findings to real mission impact; AIP validates repeatable automated assessment workflows.", "marks": ["NOT YET IN OFFICIAL DOCS as of last refresh", "Free for eligible operators", "New product: Ontology for Cybersecurity"], "status": "Announced, Sept 10, 2026 (AIPCon 11)", "rarity": "Uncommon", "firstObserved": "company-context/2026-09-16.md", "sources": [{"label": "company-context", "ref": "2026-09-16.md — Cardinal Program / Method Security"}], "buildSuggestion": "Spend 30 minutes building something small with Cardinal Program / Ontology for Cybersecurity on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}, {"n": 69, "id": "sovereignty-positioning", "name": "'AI Sovereignty' Strategic Positioning", "layer": "frontier", "tagline": "Palantir's bet: the control layer, not the frontier model.", "description": "Karp's public framing (AIPCon 11 + recirculated from the Q2 2026 shareholder letter): Palantir isn't competing to build the best frontier model — it's positioning as the sovereign application/control layer so customers keep 'maximal control' over data, operations, and decisions.", "marks": ["Commentary/strategy, not a product", "Traces to Q2 2026 shareholder letter"], "status": "Public statement, Sept 2026", "rarity": "Legendary", "firstObserved": "company-context/2026-09-16.md", "sources": [{"label": "company-context", "ref": "2026-09-16.md — The Motley Fool"}], "buildSuggestion": "Spend 30 minutes building something small with 'AI Sovereignty' Strategic Positioning on data you already have in Foundry. A tiny working example teaches more than reading the description.", "fieldNote": null}], "featureOfWeek": "palantir-mcp", "newThisWeek": ["iceberg-tables", "peer-manager", "core-object-views", "compute-modules", "model-studio", "custom-widgets", "pipeline-builder-llm-eval-suites", "aip-document-intelligence", "foundry-pro-code-agents", "devops-product-groups", "flow-capture", "sensitive-data-scanner-llm-match"], "updatedThisWeek": ["global-branching", "solution-design-tools", "ontology-mcp", "mindkit", "orchestrator", "palantir-mcp", "model-providers-in-aip"], "quiz": [{"id": "q-datahaul-trucking-integration", "title": "Joining trucking ops and finance data", "industry": "Trucking & logistics", "basis": "real", "difficulty": "easy", "scenario": "DataHAUL, a four-person trucking-analytics startup, needed to join fleets' operational driver logs with their general-ledger financial data into one Ontology model, so it could report gross profit per hour down to individual fuel transactions. Speed mattered: they built the whole product on Foundry in about two months, and they rely on a visual lineage graph of the integration to trust their numbers.", "question": "Which Foundry feature should they reach for to build that integration?", "answer": "pipeline-builder", "options": ["code-repositories", "pipeline-builder", "sql-studio", "peer-manager"], "explanation": "Pipeline Builder is Foundry's main point-and-click tool for combining raw sources into clean data and writing it straight into object types. The pipeline itself is the visual graph DataHAUL showed on stage, so a tiny team moves fast and can still show where every number came from.", "whyNot": {"code-repositories": "Powerful Git-based code for transforms, but more engineering overhead than a small team needs when the joins can be built visually.", "sql-studio": "Great for ad-hoc queries and quick tables, but not the step-by-step visual pipeline you'd maintain as a product's backbone.", "peer-manager": "Syncs Ontology objects between separate Foundry enrollments; it doesn't integrate raw source data."}, "source": {"label": "DevCon 4 talk: Startup Fellowship: DataHAUL", "ref": "devcon/devcon4/startup-fellowship-datahaul-devcon-4/note.md", "url": "https://www.youtube.com/watch?v=8D7gJlv9q_g"}}, {"id": "q-hospital-patient-field-security", "title": "Different people see different patient fields", "industry": "Healthcare", "basis": "real", "difficulty": "easy", "scenario": "In a DevCon 5 demo on notional hospital data, one Patient object type serves three audiences. Admins see names and phone numbers but not SSNs or medical fields. Nurses see medical fields but not SSNs. Patients see only their own record, and even then not their hospital-assessed risk level. The team wanted these rules defined once, on the object type itself.", "question": "Which feature lets them set these rules?", "answer": "object-property-security", "options": ["core-object-views", "partner-portals", "object-property-security", "object-timeline-autopilot"], "explanation": "Object and property security policies let you control who sees which rows and which individual properties, set directly on an object type in Ontology Manager. One Patient object type can then safely serve admins, nurses and patients without copying the data. It reached GA in April 2026.", "whyNot": {"core-object-views": "Controls how an object is displayed by default, not who is allowed to see which fields.", "partner-portals": "About giving outside users an app; it doesn't define field-by-field access on the data.", "object-timeline-autopilot": "Records who changed an object and when; it doesn't hide anything."}, "source": {"label": "DevCon 5 talk: Product Launch: Ontology Foundations", "ref": "devcon/devcon5/product-launch-ontology-foundations-devcon-5/note.md", "url": "https://www.youtube.com/watch?v=dz20P3j3GMc"}}, {"id": "q-victus-custom-simulators", "title": "Running custom simulators inside Foundry", "industry": "Robotics & autonomy", "basis": "real", "difficulty": "medium", "scenario": "Victus Technologies builds a machine-learning navigation system that keeps autonomous vehicles on course when GPS is jammed. Its Foundry architecture has to run specialized custom code, including domain-specific physics simulators for sea, air and orbit plus its own model training and evaluation, inside Foundry, scalably and securely, while operators configure missions in Workshop apps.", "question": "Which Foundry feature fits those custom simulation and training steps?", "answer": "compute-modules", "options": ["functions-ts-python", "model-studio", "code-repositories", "compute-modules"], "explanation": "Compute Modules run your own containerized code, in any language, as auto-scaling services inside Foundry that connect to datasets and the Ontology. That suits specialized simulators and training loops that don't fit standard Foundry tools, and it's exactly how Victus labeled those steps in its architecture diagram.", "whyNot": {"functions-ts-python": "Good for typed business logic on the Ontology, not for hosting heavyweight custom simulators.", "model-studio": "No-code trainers for standard forecasting, classification and regression, not a custom physics-driven navigation model.", "code-repositories": "Built for writing data transforms in supported languages, not for running a custom simulator as a scalable service."}, "source": {"label": "DevCon 4 talk: Startup Fellowship: VICTUS Technologies", "ref": "devcon/devcon4/startup-fellowship-victus-technologies-devcon-4/note.md", "url": "https://www.youtube.com/watch?v=AdGtr8fDS4o"}}, {"id": "q-insurance-public-quote-site", "title": "A public quote site for non-Foundry customers", "industry": "Insurance", "basis": "real", "difficulty": "medium", "scenario": "At DevCon 4, Palantir demoed a notional car-insurance website: anonymous visitors choose a vehicle and request a quote, an automation drafts the quote, and customers then sign up with Google or Microsoft to view it. Customers must never see or navigate Foundry itself, and exposing any object type to the public web requires the builder to type an explicit acknowledgment.", "question": "Which catalog feature covers this kind of build?", "answer": "partner-portals", "options": ["workshop", "partner-portals", "osdk", "aip-chatbot-agent-studio"], "explanation": "Partner portals and public dashboards are the pattern for serving people without Foundry seats. Foundry hosts the site, exposes only the objects you allow, supports outside sign-in, and consumer mode keeps those users out of the platform. Before this, teams had to run their own servers, tokens and login systems outside Foundry.", "whyNot": {"workshop": "The demo used Workshop for the internal admin screen; it's built for Foundry users, not anonymous public visitors.", "osdk": "The site uses the OSDK to read and write data, but the SDK alone doesn't provide public hosting, sign-up or consumer lockdown.", "aip-chatbot-agent-studio": "Builds chatbots and agents; the need here is a full customer web app with public access."}, "source": {"label": "DevCon 4 talk: Deep Dive: Building Partner Portals to Public Dashboards", "ref": "devcon/devcon4/deep-dive-building-part       '<span class="copy-status" role="status"></span>' +
      '<textarea class="prompt-box" readonly aria-label="Build prompt for Claude Code"></textarea>' +
      '<h3>First seen</h3><p>' + esc(f.firstObserved) + '</p>' +
      '<h3>Sources</h3><ul class="sources">' + f.sources.map(function(s){ return '<li>' + esc(s.label) + ': ' + esc(s.ref) + '</li>'; }).join('') + '</ul>';
    var i = visibleOrder.indexOf(id);
    document.getElementById('pos').textContent = i >= 0 ? (i + 1) + ' of ' + visibleOrder.length : '';
    document.getElementById('prevBtn').disabled = i <= 0;
    document.getElementById('nextBtn').disabled = i < 0 || i >= visibleOrder.length - 1;
    if(!viewer.open) viewer.showModal();
    viewer.scrollTop = 0;
    if(history.replaceState) history.replaceState(null, '', '#' + id);
    if(!silent) tick();
    if(justCollected){ renderProgress(); renderFresh(); renderBinder(); }
  }
  function step(delta){
    var i = visibleOrder.indexOf(currentId);
    if(i < 0) return;
    var j = i + delta;
    if(j >= 0 && j < visibleOrder.length) openViewer(visibleOrder[j]);
  }
  document.getElementById('closeBtn').addEventListener('click', function(){ viewer.close(); });
  document.getElementById('prevBtn').addEventListener('click', function(){ step(-1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ step(1); });
  viewer.addEventListener('click', function(e){ if(e.target === viewer) viewer.close(); });
  viewer.addEventListener('keydown', function(e){
    if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight') step(1);
    else if(e.key === 'ArrowLeft') step(-1);
  });
  viewer.addEventListener('close', function(){
    currentId = null;
    if(history.replaceState) history.replaceState(null, '', location.pathname + location.search);
  });

  document.getElementById('randomBtn').addEventListener('click', function(){
    var pool = features.filter(function(f){ return !collected[f.id]; });
    if(!pool.length) pool = features;
    openViewer(pool[Math.floor(Math.random() * pool.length)].id);
  });

  document.addEventListener('click', function(e){
    var copyBtn = e.target.closest('[data-copy]');
    if(copyBtn){ copyPrompt(copyBtn); return; }
    var card = e.target.closest('.tcg[data-id]');
    if(card && !card.closest('#viewerCard')) openViewer(card.getAttribute('data-id'));
  });

  // ---- quiz: play the right card for a data case ----
  var bank = DATA.quiz || [];
  var quizEl = document.getElementById('quiz'), quizBody = document.getElementById('quizBody');
  var round = null;
  var quizStats = {};
  try{ quizStats = JSON.parse(localStorage.getItem('ffg_quiz') || '{}') || {}; }catch(e){ quizStats = {}; }
  function shuffled(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function sourceLink(q, text){
    var src = q.source || {};
    if(!src.url) return '';
    return '<a href="' + esc(src.url) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + '</a>';
  }
  function paintQuizPos(){
    document.getElementById('quizPos').textContent =
      'Case ' + (round.i + 1) + ' of ' + round.order.length + ', ' + round.score + ' right so far';
  }
  function renderQuizBand(){
    if(!bank.length) return;
    document.getElementById('quizBand').hidden = false;
    document.getElementById('quizBtn').hidden = false;
    document.getElementById('quizBandText').textContent =
      bank.length + ' data cases. Pick the Foundry feature that solves each one, and learn why the others don\u2019t.' +
      (quizStats.best != null ? ' Your best round: ' + quizStats.best + ' of ' + quizStats.outOf + '.' : '');
  }
  function newRound(){ round = {order:shuffled(bank), i:0, score:0, missed:[], answered:false, ended:false}; }
  function startQuiz(){
    if(!bank.length) return;
    if(!quizEl.open) quizEl.showModal();
    if(!round || round.ended){ newRound(); renderCase(); }
    else if(round.answered) advance();
    else renderCase();
  }
  function advance(){
    round.i++;
    round.answered = false;
    if(round.i >= round.order.length) renderEnd(); else renderCase();
  }
  function renderCase(){
    var q = round.order[round.i], src = q.source || {};
    paintQuizPos();
    quizBody.innerHTML =
      '<div class="meta-line">' +
        '<span class="chip">' + esc(q.industry) + '</span>' +
        '<span class="chip">' + (q.basis === 'real' ? 'Real case' : 'Illustrative scenario') + '</span>' +
        '<span class="chip">' + esc(q.difficulty.charAt(0).toUpperCase() + q.difficulty.slice(1)) + '</span>' +
      '</div>' +
      '<h2 id="quizTitle">' + esc(q.title) + '</h2>' +
      '<p class="scenario">' + esc(q.scenario) + '</p>' +
      (src.label ? '<p class="source-line">' + (q.basis === 'real' ? 'Based on ' : 'Reference: ') +
        (src.url ? sourceLink(q, src.label) : esc(src.label)) + '</p>' : '') +
      '<h3 class="question">' + esc(q.question) + '</h3>' +
      '<div class="options" role="group" aria-label="Answer choices">' + shuffled(q.options).map(function(id){
        var f = byId(id);
        return '<button type="button" class="option" data-opt="' + esc(id) + '" style="--lc:' + layerById[f.layer].color + '">' +
          '<span class="opt-name">' + esc(f.name) + '</span><span class="opt-tag">' + esc(f.tagline) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="feedback" aria-live="polite"></div>';
    quizEl.scrollTop = 0;
  }
  function answer(pickId){
    if(round.answered) return;
    round.answered = true;
    var q = round.order[round.i], right = pickId === q.answer, ans = byId(q.answer), justCollected = false;
    if(right){ round.score++; justCollected = collect(q.answer); tick(); }
    else round.missed.push(q.answer);
    quizBody.querySelector('.options').classList.add('answered');
    quizBody.querySelectorAll('.option').forEach(function(b){
      var id = b.getAttribute('data-opt');
      b.disabled = true;
      if(id === q.answer){ b.classList.add('correct'); b.insertAdjacentHTML('beforeend', '<span class="opt-flag">Right card</span>'); }
      else if(id === pickId){ b.classList.add('picked-wrong'); b.insertAdjacentHTML('beforeend', '<span class="opt-flag">Your pick</span>'); }
      else b.classList.add('faded');
    });
    var whyNot = Object.keys(q.whyNot || {}).map(function(id){
      var f = byId(id);
      return f ? '<li><strong>' + esc(f.name) + ':</strong> ' + esc(q.whyNot[id]) + '</li>' : '';
    }).join('');
    var last = round.i === round.order.length - 1;
    quizBody.querySelector('.feedback').innerHTML =
      '<p class="verdict"><strong>' + (right ? 'Right card.' : 'Not quite. The right card is ' + esc(ans.name) + '.') + '</strong></p>' +
      (justCollected ? '<div class="meta-line"><span class="chip got">' + esc(ans.name) + ' added to your collection</span></div>' : '') +
      '<p>' + esc(q.explanation) + '</p>' +
      (whyNot ? '<h4>Why not the others</h4><ul>' + whyNot + '</ul>' : '') +
      '<div class="quiz-actions">' +
        '<button type="button" class="btn" data-quiz="next">' + (last ? 'See your score' : 'Next case') + '</button>' +
        '<button type="button" class="link-btn" data-study="' + esc(q.answer) + '">Study the ' + esc(ans.name) + ' card</button>' +
        sourceLink(q, q.basis === 'real' ? 'Read the real case' : 'Read the docs') +
      '</div>';
    paintQuizPos();
    if(justCollected){ renderProgress(); renderFresh(); renderBinder(); }
  }
  function renderEnd(){
    round.ended = true;
    var n = round.order.length, s = round.score;
    quizStats = {best:Math.max(quizStats.best || 0, s), outOf:n};
    try{ localStorage.setItem('ffg_quiz', JSON.stringify(quizStats)); }catch(e){}
    document.getElementById('quizPos').textContent = 'Round complete';
    var missed = round.missed.filter(function(id, i, a){ return a.indexOf(id) === i; });
    quizBody.innerHTML =
      '<h2 id="quizTitle">You played the right card ' + s + ' of ' + n + ' times</h2>' +
      '<p>' + (s === n ? 'No misses. ' : '') + 'Your best round: ' + quizStats.best + ' of ' + n + '.</p>' +
      (missed.length ? '<h3>Cards worth studying</h3><ul>' + missed.map(function(id){
        var f = byId(id);
        return '<li><button type="button" class="link-btn" data-study="' + esc(id) + '">' + esc(f.name) + '</button>: ' + esc(f.tagline) + '</li>';
      }).join('') + '</ul>' : '') +
      '<div class="quiz-actions"><button type="button" class="btn" data-quiz="again">Play again</button></div>';
    renderQuizBand();
  }
  quizBody.addEventListener('click', function(e){
    var opt = e.target.closest('.option');
    if(opt && !opt.disabled){ answer(opt.getAttribute('data-opt')); return; }
    var nav = e.target.closest('[data-quiz]');
    if(nav){
      if(nav.getAttribute('data-quiz') === 'next') advance();
      else { newRound(); renderCase(); }
      return;
    }
    var study = e.target.closest('[data-study]');
    if(study){ quizEl.close(); openViewer(study.getAttribute('data-study')); }
  });
  document.getElementById('quizBtn').addEventListener('click', startQuiz);
  document.getElementById('quizStart').addEventListener('click', startQuiz);
  document.getElementById('quizClose').addEventListener('click', function(){ quizEl.close(); });
  quizEl.addEventListener('click', function(e){ if(e.target === quizEl) quizEl.close(); });

  document.getElementById('genDate').textContent = DATA.generated;
  renderHero();
  renderProgress();
  renderFresh();
  renderBinder();
  renderQuizBand();

  var hash = location.hash.replace('#', '');
  if(hash && byId(hash)) openViewer(hash, true);
})();
</script>
</body>
</html>
